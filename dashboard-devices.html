const STORAGE_KEY = 'dashboard-devices-v2';

/* ───────── 状态 + 持久化 ───────── */
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    data: state.data, tagLibrary: state.tagLibrary
  }));
}

const persisted = loadState();
const state = {
  data: persisted?.data ?? structuredClone(INIT_DATA),
  tagLibrary: persisted?.tagLibrary ?? structuredClone(INIT_TAG_LIBRARY),
  selectedCells: new Set(),
  filterTag: null  // 详情区按此标签筛选卡片；null=全部
};

/* 维持图片路径与初始一致（即便有旧数据也用最新路径） */
state.data.forEach(item => {
  const init = INIT_DATA.find(i => i.id === item.id);
  if (init) item.image = init.image;
});

/* 自动补全标签库：把数据里出现但库里没有的标签加进来（颜色自动分配） */
function syncTagLibrary() {
  const known = new Set(state.tagLibrary.map(t => t.name));
  const seen = new Set();
  state.data.forEach(d => d.tags.forEach(t => seen.add(t)));
  let added = 0;
  seen.forEach(name => {
    if (!known.has(name)) {
      state.tagLibrary.push({ name, color: nextColor() });
      added++;
    }
  });
  if (added > 0) saveState();
}
syncTagLibrary();

const cellKey = (city, persona) => `${city}|${persona}`;
const parseKey = k => { const [city, persona] = k.split('|'); return { city, persona }; };

function tagColor(name) {
  const t = state.tagLibrary.find(t => t.name === name);
  return t ? t.color : '#9E9E9E';
}

function tagCount(name) {
  return state.data.filter(d => d.tags.includes(name)).length;
}

function nextColor() {
  const used = new Set(state.tagLibrary.map(t => t.color));
  return PALETTE.find(c => !used.has(c)) || PALETTE[state.tagLibrary.length % PALETTE.length];
}

/* ───────── 标签库渲染 ───────── */
function renderTagLibrary() {
  const wrap = document.getElementById('tag-library-list');
  wrap.innerHTML = '';
  state.tagLibrary.forEach(t => {
    const cnt = tagCount(t.name);
    const el = document.createElement('span');
    el.className = 'lib-tag';
    el.style.background = t.color;
    el.title = '点击改颜色';
    el.innerHTML = `<span class="lib-name">${escapeHtml(t.name)}</span> <span class="count">${cnt}</span> <span class="x" title="删除该类别（会从所有卡片移除）">×</span>`;
    /* 点 chip 主体（避开 ×）改颜色 */
    el.onclick = (e) => {
      if (e.target.classList.contains('x')) return;
      const picker = document.createElement('input');
      picker.type = 'color';
      picker.value = rgbToHex(t.color);
      picker.style.cssText = 'position:fixed;left:-9999px';
      document.body.appendChild(picker);
      picker.oninput = () => { t.color = picker.value; saveState(); render(); };
      picker.onchange = () => { picker.remove(); };
      picker.click();
    };
    el.querySelector('.x').onclick = (e) => {
      e.stopPropagation();
      if (!confirm(`删除标签「${t.name}」？这会从所有卡片移除该标签（共 ${cnt} 处）。`)) return;
      state.tagLibrary = state.tagLibrary.filter(x => x.name !== t.name);
      state.data.forEach(d => { d.tags = d.tags.filter(n => n !== t.name); });
      saveState(); render();
    };
    wrap.appendChild(el);
  });
}

/* 颜色字符串规整成 #RRGGBB（color input 只认这个）*/
function rgbToHex(c) {
  if (!c) return '#999999';
  if (c.startsWith('#') && c.length === 7) return c;
  if (c.startsWith('#') && c.length === 4) {
    return '#' + c.slice(1).split('').map(x => x+x).join('');
  }
  const m = c.match(/\d+/g);
  if (m && m.length >= 3) {
    return '#' + m.slice(0,3).map(n => Number(n).toString(16).padStart(2,'0')).join('');
  }
  return '#999999';
}

/* ───────── 矩阵 ───────── */
function renderMatrix() {
  const matrix = document.getElementById('matrix');
  matrix.style.gridTemplateColumns = `100px repeat(${CITIES.length}, 1fr)`;
  matrix.innerHTML = '';

  matrix.appendChild(divEl('mx-head', ''));
  CITIES.forEach(c => matrix.appendChild(divEl('mx-head', c)));

  PERSONAS.forEach(p => {
    matrix.appendChild(divEl('mx-row-label', p));
    CITIES.forEach(c => {
      const items = state.data.filter(d => d.city === c && d.persona === p);
      matrix.appendChild(buildCell(c, p, items));
    });
  });
}

function buildCell(city, persona, items) {
  const cell = document.createElement('div');
  cell.className = 'mx-cell' + (items.length === 0 ? ' empty' : '');
  if (state.selectedCells.has(cellKey(city, persona))) cell.classList.add('selected');

  const head = document.createElement('div');
  head.className = 'cell-count';
  head.innerHTML = `${items.length}<span class="total-label">条</span>`;
  cell.appendChild(head);

  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-text';
    empty.textContent = '— 暂无数据 —';
    cell.appendChild(empty);
  } else {
    /* 标签计数（含未打标签 = 待分类） */
    const tagCnt = {};
    let untagged = 0;
    items.forEach(it => {
      if (it.tags.length === 0) untagged++;
      else it.tags.forEach(t => tagCnt[t] = (tagCnt[t] || 0) + 1);
    });

    const total = Object.values(tagCnt).reduce((a,b)=>a+b, 0) + untagged;

    /* 堆叠条 */
    const bar = document.createElement('div');
    bar.className = 'stack-bar';
    state.tagLibrary.forEach(t => {
      if (tagCnt[t.name]) {
        const seg = document.createElement('div');
        seg.style.background = t.color;
        seg.style.width = (tagCnt[t.name] / total * 100) + '%';
        seg.title = `${t.name}: ${tagCnt[t.name]}`;
        bar.appendChild(seg);
      }
    });
    if (untagged > 0) {
      const seg = document.createElement('div');
      seg.style.background = '#ddd';
      seg.style.width = (untagged / total * 100) + '%';
      seg.title = `待分类: ${untagged}`;
      bar.appendChild(seg);
    }
    cell.appendChild(bar);

    /* 文字列表 */
    const list = document.createElement('div');
    list.className = 'mini-list';
    const sorted = Object.entries(tagCnt).sort((a,b) => b[1]-a[1]);
    sorted.forEach(([name, cnt]) => {
      const r = document.createElement('div');
      r.className = 'row';
      r.innerHTML = `<span class="swatch" style="background:${tagColor(name)}"></span><span class="name">${escapeHtml(name)}</span><span class="cnt">${cnt}</span>`;
      list.appendChild(r);
    });
    if (untagged > 0) {
      const r = document.createElement('div');
      r.className = 'row';
      r.innerHTML = `<span class="swatch" style="background:#ddd"></span><span class="name" style="color:#999">待分类</span><span class="cnt">${untagged}</span>`;
      list.appendChild(r);
    }
    cell.appendChild(list);
  }

  cell.onclick = () => {
    const key = cellKey(city, persona);
    if (state.selectedCells.has(key)) state.selectedCells.delete(key);
    else state.selectedCells.add(key);
    render();
  };
  return cell;
}

/* ───────── 详情 ───────── */
function renderDetail() {
  const detail = document.getElementById('detail');
  const info = document.getElementById('selection-info');
  const clearBtn = document.getElementById('clear-btn');

  const keys = [...state.selectedCells];
  if (keys.length === 0) {
    detail.className = 'detail empty';
    detail.textContent = '点击上方矩阵中的任意一个或多个格子，查看实拍图片 + 文字 + 标签';
    info.textContent = '';
    clearBtn.disabled = true;
    return;
  }

  const items = [];
  keys.forEach(k => {
    const { city, persona } = parseKey(k);
    state.data.filter(d => d.city === city && d.persona === persona)
      .forEach(d => items.push(d));
  });

  detail.className = 'detail';
  detail.innerHTML = '';
  info.textContent = `已选 ${keys.length} 格 · 共 ${items.length} 条`;
  clearBtn.disabled = false;

  const head = document.createElement('div');
  head.className = 'detail-head';
  const tagsHtml = keys.map(k => {
    const { city, persona } = parseKey(k);
    return `<span class="src-tag">${city}·${persona}</span>`;
  }).join('');
  head.innerHTML = `
    <div>
      <div class="detail-title">汇总视图</div>
      <div class="detail-sub">${items.length} 张实拍图 · ${new Set(items.flatMap(i=>i.tags)).size} 种类别</div>
      <div class="source-tags">${tagsHtml}</div>
    </div>
  `;
  detail.appendChild(head);

  /* 标签分布柱图 */
  const tagCnt = {};
  let untagged = 0;
  items.forEach(it => {
    if (it.tags.length === 0) untagged++;
    else it.tags.forEach(t => tagCnt[t] = (tagCnt[t] || 0) + 1);
  });
  const max = Math.max(1, untagged, ...Object.values(tagCnt));
  const chart = document.createElement('div');
  chart.className = 'chart-block';
  chart.innerHTML = '<h3>类别分布</h3>';
  Object.entries(tagCnt).sort((a,b)=>b[1]-a[1]).forEach(([name, cnt]) => {
    chart.appendChild(buildBarRow(name, cnt, max, tagColor(name)));
  });
  if (untagged > 0) chart.appendChild(buildBarRow('待分类', untagged, max, '#bbb'));
  detail.appendChild(chart);

  /* 卡片网格 + 标签筛选 */
  const cardsArea = document.createElement('div');
  cardsArea.className = 'cards-area';
  cardsArea.innerHTML = '<h3>实拍图片（点缩略图放大查看；点 + 添加 / 修改标签）</h3>';

  // 筛选条
  const filterRow = document.createElement('div');
  filterRow.className = 'filter-row';
  const presentTags = Object.keys(tagCnt).sort((a,b) => tagCnt[b]-tagCnt[a]);
  const filterAll = document.createElement('span');
  filterAll.className = 'filter-chip' + (state.filterTag === null ? ' active' : '');
  filterAll.textContent = `全部 ${items.length}`;
  filterAll.onclick = () => { state.filterTag = null; render(); };
  filterRow.appendChild(filterAll);
  presentTags.forEach(name => {
    const c = document.createElement('span');
    c.className = 'filter-chip' + (state.filterTag === name ? ' active' : '');
    c.style.setProperty('--tag-color', tagColor(name));
    c.innerHTML = `<span class="dot" style="background:${tagColor(name)}"></span>${escapeHtml(name)} ${tagCnt[name]}`;
    c.onclick = () => {
      state.filterTag = (state.filterTag === name) ? null : name;
      render();
    };
    filterRow.appendChild(c);
  });
  if (untagged > 0) {
    const c = document.createElement('span');
    c.className = 'filter-chip' + (state.filterTag === '__untagged__' ? ' active' : '');
    c.innerHTML = `<span class="dot" style="background:#bbb"></span>待分类 ${untagged}`;
    c.onclick = () => {
      state.filterTag = (state.filterTag === '__untagged__') ? null : '__untagged__';
      render();
    };
    filterRow.appendChild(c);
  }
  cardsArea.appendChild(filterRow);

  // 应用筛选
  let visible = items;
  if (state.filterTag === '__untagged__') {
    visible = items.filter(it => it.tags.length === 0);
  } else if (state.filterTag) {
    visible = items.filter(it => it.tags.includes(state.filterTag));
  } else {
    // 全部：按标签数量从多到少分组（同一标签的卡片放在一起；待分类放最后）
    const primaryTagOf = (it) => {
      if (!it.tags || it.tags.length === 0) return null;
      return it.tags.slice().sort((x, y) => (tagCnt[y] || 0) - (tagCnt[x] || 0))[0];
    };
    visible = items.slice().sort((a, b) => {
      const pa = primaryTagOf(a), pb = primaryTagOf(b);
      if (pa === null && pb === null) return 0;
      if (pa === null) return 1;
      if (pb === null) return -1;
      const ca = tagCnt[pa] || 0, cb = tagCnt[pb] || 0;
      if (ca !== cb) return cb - ca;
      if (pa !== pb) return pa < pb ? -1 : 1;
      return 0;
    });
  }

  const grid = document.createElement('div');
  grid.className = 'cards-grid';
  visible.forEach(it => grid.appendChild(buildPhotoCard(it)));
  if (visible.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'color:#aaa;font-size:13px;padding:20px;grid-column:1/-1;text-align:center';
    empty.textContent = '— 该标签下没有图片 —';
    grid.appendChild(empty);
  }
  cardsArea.appendChild(grid);
  detail.appendChild(cardsArea);
}

function buildPhotoCard(item) {
  const card = document.createElement('div');
  card.className = 'photo-card';

  const img = document.createElement('img');
  img.className = 'photo';
  img.src = item.image;
  img.alt = '';
  img.onclick = () => openLightbox(item.image);
  img.onerror = () => { img.style.display = 'none'; };
  card.appendChild(img);

  const body = document.createElement('div');
  body.className = 'body';
  body.innerHTML = `
    <span class="src">${item.city}·${item.persona}</span>
    <div class="text">${escapeHtml(item.text)}</div>
  `;

  const tagsBox = document.createElement('div');
  tagsBox.className = 'tags';
  item.tags.forEach(name => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.style.background = tagColor(name);
    chip.innerHTML = `${escapeHtml(name)} <span class="x">×</span>`;
    chip.querySelector('.x').onclick = (e) => {
      e.stopPropagation();
      item.tags = item.tags.filter(n => n !== name);
      saveState(); render();
    };
    tagsBox.appendChild(chip);
  });
  /* + 按钮 */
  const addBtn = document.createElement('span');
  addBtn.className = 'chip chip-add';
  addBtn.textContent = '+ 添加标签';
  addBtn.onclick = (e) => { e.stopPropagation(); openTagPicker(addBtn, item); };
  tagsBox.appendChild(addBtn);

  body.appendChild(tagsBox);
  card.appendChild(body);
  return card;
}

/* ───────── 标签选择浮层 ───────── */
function openTagPicker(anchor, item) {
  const picker = document.getElementById('tag-picker');
  picker.innerHTML = '';

  const list = document.createElement('div');
  list.className = 'pick-list';
  state.tagLibrary.forEach(t => {
    const has = item.tags.includes(t.name);
    const el = document.createElement('span');
    el.className = 'pick' + (has ? ' disabled' : '');
    el.style.background = t.color;
    el.textContent = t.name;
    if (!has) el.onclick = () => {
      item.tags.push(t.name);
      saveState(); closeTagPicker(); render();
    };
    list.appendChild(el);
  });
  picker.appendChild(list);

  const newRow = document.createElement('div');
  newRow.className = 'new-row';
  newRow.innerHTML = `<input placeholder="新建标签…" maxlength="20"><button>添加</button>`;
  const input = newRow.querySelector('input');
  const btn = newRow.querySelector('button');
  const create = () => {
    const name = input.value.trim();
    if (!name) return;
    if (state.tagLibrary.some(t => t.name === name)) {
      if (!item.tags.includes(name)) item.tags.push(name);
    } else {
      state.tagLibrary.push({ name, color: nextColor() });
      item.tags.push(name);
    }
    saveState(); closeTagPicker(); render();
  };
  btn.onclick = create;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') create(); });
  picker.appendChild(newRow);

  /* 定位 */
  const rect = anchor.getBoundingClientRect();
  picker.style.display = 'block';
  picker.style.left = (rect.left + window.scrollX) + 'px';
  picker.style.top = (rect.bottom + window.scrollY + 4) + 'px';
  setTimeout(() => input.focus(), 0);

  /* 点外部关闭 */
  setTimeout(() => {
    document.addEventListener('click', closeOnOutside, { once: true });
  }, 0);
}
function closeOnOutside(e) {
  const picker = document.getElementById('tag-picker');
  if (!picker.contains(e.target)) closeTagPicker();
  else document.addEventListener('click', closeOnOutside, { once: true });
}
function closeTagPicker() {
  document.getElementById('tag-picker').style.display = 'none';
}

/* ───────── lightbox ───────── */
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').style.display = 'flex';
}

/* ───────── helpers ───────── */
function buildBarRow(label, cnt, max, color) {
  const row = document.createElement('div');
  row.className = 'bar-row';
  const pct = max > 0 ? (cnt / max * 100) : 0;
  row.innerHTML = `
    <div class="bar-label">${escapeHtml(label)}</div>
    <div class="bar-track">
      <div class="bar-fill" style="background:${color};width:${pct}%">${cnt > 0 ? cnt : ''}</div>
    </div>
  `;
  return row;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function divEl(cls, text) {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = text;
  return d;
}

function clearSelection() { state.selectedCells.clear(); render(); }

function selectAll() {
  state.selectedCells.clear();
  CITIES.forEach(c => {
    PERSONAS.forEach(p => {
      const has = state.data.some(d => d.city === c && d.persona === p);
      if (has) state.selectedCells.add(cellKey(c, p));
    });
  });
  render();
}

function resetAll() {
  if (!confirm('恢复到初始数据？所有手动标签改动会丢失。')) return;
  state.data = structuredClone(INIT_DATA);
  state.tagLibrary = structuredClone(INIT_TAG_LIBRARY);
  state.selectedCells.clear();
  saveState(); render();
}

/* ───────── 导出 / 导入 ───────── */
function exportData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  const payload = {
    app: 'ginger-dashboard',
    key: STORAGE_KEY,
    exportedAt: new Date().toISOString(),
    data: raw ? JSON.parse(raw) : null
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  a.href = url;
  a.download = `${STORAGE_KEY}_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const payload = JSON.parse(e.target.result);
      const incoming = (payload && typeof payload === 'object' && 'data' in payload) ? payload.data : payload;
      if (!incoming || typeof incoming !== 'object') throw new Error('文件内容无效');
      if (payload.key && payload.key !== STORAGE_KEY) {
        if (!confirm(`这份文件来自 "${payload.key}"，与当前页面 "${STORAGE_KEY}" 不一致。仍然导入？`)) return;
      }
      if (!confirm('导入后将覆盖当前所有标签和分类数据，是否继续？')) return;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(incoming));
      location.reload();
    } catch (err) {
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
}

function render() {
  renderTagLibrary();
  renderMatrix();
  renderDetail();
}

render();
</script>
