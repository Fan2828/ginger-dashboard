/* ───────── 状态 ───────── */
const state = { selectedCells: new Set() };
const cellKey = (city, persona) => `${city}|${persona}`;
const parseKey = k => { const [city, persona] = k.split('|'); return { city, persona }; };

/* ───────── 全局最大值 ───────── */
function computeGlobalMaxSubCount() {
  let max = 1;
  CITIES.forEach(c => {
    PERSONAS.forEach(p => {
      const cellItems = DATA.filter(d => d.city === c && d.persona === p);
      const cnts = {};
      cellItems.forEach(it => cnts[it.device] = (cnts[it.device] || 0) + 1);
      Object.values(cnts).forEach(v => { if (v > max) max = v; });
    });
  });
  return max;
}
const GLOBAL_MAX = computeGlobalMaxSubCount();

/* ───────── 矩阵渲染 ───────── */
function renderMatrix() {
  const matrix = document.getElementById('matrix');
  matrix.style.gridTemplateColumns = `100px repeat(${CITIES.length}, 1fr)`;
  matrix.innerHTML = '';

  matrix.appendChild(divEl('mx-head', ''));
  CITIES.forEach(c => matrix.appendChild(divEl('mx-head', c)));

  PERSONAS.forEach(p => {
    matrix.appendChild(divEl('mx-row-label', p));
    CITIES.forEach(c => {
      const items = DATA.filter(d => d.city === c && d.persona === p);
      matrix.appendChild(buildCell(c, p, items));
    });
  });
}

function buildCell(city, persona, items) {
  const cell = document.createElement('div');
  cell.className = 'mx-cell' + (items.length === 0 ? ' empty' : '');
  if (state.selectedCells.has(cellKey(city, persona))) cell.classList.add('selected');

  const total = items.length;
  const head = document.createElement('div');
  head.className = 'cell-count';
  head.innerHTML = `${total}<span class="total-label">条</span>`;
  cell.appendChild(head);

  if (total === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-text';
    empty.textContent = '— 暂无数据 —';
    cell.appendChild(empty);
  } else {
    // 4 大类堆叠条
    const catCounts = {};
    CATEGORIES.forEach(c => catCounts[c.id] = 0);
    items.forEach(it => { const c = DEVICE_TO_CAT[it.device]; if (c) catCounts[c.id]++; });
    const bar = document.createElement('div');
    bar.className = 'stack-bar';
    CATEGORIES.forEach(c => {
      if (catCounts[c.id] > 0) {
        const seg = document.createElement('div');
        seg.className = 'c-' + c.color;
        seg.style.width = (catCounts[c.id] / total * 100) + '%';
        seg.title = `${c.name}: ${catCounts[c.id]}`;
        bar.appendChild(seg);
      }
    });
    cell.appendChild(bar);

    // 子型号迷你柱状图（按条数降序，仅有数据）
    const subCounts = {};
    items.forEach(it => subCounts[it.device] = (subCounts[it.device] || 0) + 1);
    const sortedDevices = Object.keys(subCounts)
      .sort((a, b) => subCounts[b] - subCounts[a] || DEVICE_ORDER.indexOf(a) - DEVICE_ORDER.indexOf(b));

    const chart = document.createElement('div');
    chart.className = 'mini-chart';
    sortedDevices.forEach(device => {
      const cnt = subCounts[device];
      const cat = DEVICE_TO_CAT[device];
      const wrap = document.createElement('div');
      wrap.className = 'mini-bar-wrap';
      wrap.title = `${device}: ${cnt} 条`;
      wrap.innerHTML = `
        <div class="mini-bar-count">${cnt}</div>
        <div class="mini-bar c-${cat.color}" style="height:${cnt / GLOBAL_MAX * 100}%"></div>
      `;
      chart.appendChild(wrap);
    });
    cell.appendChild(chart);

    // 标签行
    const labels = document.createElement('div');
    labels.style.cssText = 'display:flex;gap:3px;';
    sortedDevices.forEach(device => {
      const lab = document.createElement('div');
      lab.className = 'mini-label';
      lab.style.flex = '1';
      lab.style.textAlign = 'center';
      lab.style.minWidth = '18px';
      lab.textContent = shortLabel(device);
      lab.title = device;
      labels.appendChild(lab);
    });
    cell.appendChild(labels);
  }

  cell.onclick = () => {
    const key = cellKey(city, persona);
    if (state.selectedCells.has(key)) state.selectedCells.delete(key);
    else state.selectedCells.add(key);
    render();
  };
  return cell;
}

/* 子型号短标：杯垫、杯A、杯B、机A、机B、机C、其他 */
function shortLabel(device) {
  if (device === '加热杯垫') return '杯垫';
  if (device.startsWith('加热杯 ')) return '杯' + device.slice(-1);
  if (device.startsWith('加热饮水机 ')) return '机' + device.slice(-1);
  return '其他';
}

/* ───────── 详情面板 ───────── */
function renderDetail() {
  const detail = document.getElementById('detail');
  const info = document.getElementById('selection-info');
  const clearBtn = document.getElementById('clear-btn');

  const keys = [...state.selectedCells];
  if (keys.length === 0) {
    detail.className = 'detail empty';
    detail.textContent = '点击上方矩阵中的任意一个或多个格子，查看汇总分布与原文卡片';
    info.textContent = '';
    clearBtn.disabled = true;
    return;
  }

  const items = [];
  keys.forEach(k => {
    const { city, persona } = parseKey(k);
    DATA.filter(d => d.city === city && d.persona === persona)
      .forEach(d => items.push({ ...d, source: `${city}·${persona}` }));
  });

  detail.className = 'detail';
  detail.innerHTML = '';
  info.textContent = `已选 ${keys.length} 格 · 共 ${items.length} 条`;
  clearBtn.disabled = false;

  const head = document.createElement('div');
  head.className = 'detail-head';
  const tagsHtml = keys.map(k => {
    const { city, persona } = parseKey(k);
    return `<span class="src-tag">${city}·${persona}</span>`;
  }).join('');
  head.innerHTML = `
    <div>
      <div class="detail-title">汇总视图</div>
      <div class="detail-sub">${items.length} 条原因 · 涉及 ${new Set(items.map(i=>i.device)).size} 种型号</div>
      <div class="source-tags">${tagsHtml}</div>
    </div>
  `;
  detail.appendChild(head);

  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'color:#aaa;text-align:center;padding:30px;font-size:13px';
    empty.textContent = '所选格子无数据';
    detail.appendChild(empty);
    return;
  }

  const charts = document.createElement('div');
  charts.className = 'charts-row';

  // 4 大类
  const catCounts = {};
  CATEGORIES.forEach(c => catCounts[c.id] = 0);
  items.forEach(it => { const c = DEVICE_TO_CAT[it.device]; if (c) catCounts[c.id]++; });
  const maxCat = Math.max(1, ...Object.values(catCounts));
  const catBlock = document.createElement('div');
  catBlock.className = 'chart-block';
  catBlock.innerHTML = '<h3>4 大类分布</h3>';
  CATEGORIES.forEach(c => {
    catBlock.appendChild(buildBarRow(c.name, catCounts[c.id], maxCat, c.color));
  });
  charts.appendChild(catBlock);

  // 7 子型号
  const subCounts = {};
  items.forEach(it => subCounts[it.device] = (subCounts[it.device] || 0) + 1);
  const maxSub = Math.max(1, ...Object.values(subCounts));
  const subBlock = document.createElement('div');
  subBlock.className = 'chart-block';
  subBlock.innerHTML = '<h3>子型号分布（按条数降序）</h3>';
  const sortedDevices = Object.keys(subCounts)
    .sort((a, b) => subCounts[b] - subCounts[a]);
  sortedDevices.forEach(device => {
    const cat = DEVICE_TO_CAT[device];
    subBlock.appendChild(buildBarRow(device, subCounts[device], maxSub, cat.color));
  });
  charts.appendChild(subBlock);
  detail.appendChild(charts);

  // 卡片清单
  const cardsArea = document.createElement('div');
  cardsArea.className = 'cards-area';
  cardsArea.innerHTML = '<h3>原因卡片（按型号分组）</h3>';
  const grid = document.createElement('div');
  grid.className = 'cards-by-sub';
  sortedDevices.forEach(device => {
    const cat = DEVICE_TO_CAT[device];
    const block = document.createElement('div');
    block.className = 'sub-block b-' + cat.color;
    block.innerHTML = `<div class="sub-block-title">${device} · ${subCounts[device]}</div>`;
    items.filter(i => i.device === device).forEach(it => {
      const card = document.createElement('div');
      card.className = 'sub-card';
      card.innerHTML = `<div class="sub-card-source">${it.source}</div>${escapeHtml(it.reason)}`;
      block.appendChild(card);
    });
    grid.appendChild(block);
  });
  cardsArea.appendChild(grid);
  detail.appendChild(cardsArea);
}

function buildBarRow(label, cnt, max, color) {
  const row = document.createElement('div');
  row.className = 'bar-row';
  const pct = max > 0 ? (cnt / max * 100) : 0;
  row.innerHTML = `
    <div class="bar-label">${label}</div>
    <div class="bar-track">
      <div class="bar-fill c-${color}" style="width:${pct}%">${cnt > 0 ? cnt : ''}</div>
    </div>
  `;
  return row;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function divEl(cls, text) {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = text;
  return d;
}

function clearSelection() {
  state.selectedCells.clear();
  render();
}

function renderLegend() {
  const wrap = document.getElementById('legend');
  wrap.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const group = document.createElement('div');
    group.className = 'legend-group';
    const title = document.createElement('span');
    title.className = `legend-group-title c-${cat.color}`;
    title.textContent = cat.name;
    group.appendChild(title);
    const items = document.createElement('div');
    items.className = 'legend-items';
    cat.devices.forEach(device => {
      const item = document.createElement('span');
      item.className = 'legend-item';
      item.innerHTML = `<span class="legend-chip c-${cat.color}"></span>${device}`;
      items.appendChild(item);
    });
    group.appendChild(items);
    wrap.appendChild(group);
  });
}

function render() {
  renderLegend();
  renderMatrix();
  renderDetail();
}

render();
