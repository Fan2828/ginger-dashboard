<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧋冬日奶茶暖饮场景</title>
<style>
:root{
  --bg:#f8f1e4;
  --ink:#2d2925;
  --muted:#8c8378;
  --muted-2:#a69d91;
  --line:#d9cdbb;
  --line-soft:#eadfcc;
  --panel:#f1ead8;
  --panel-2:#fbf5e9;
  --accent:#d26f3b;
  --accent-dark:#a9562e;
  --dark:#25211f;
  --tile-gap:5px;
}
*{box-sizing:border-box;margin:0;padding:0;letter-spacing:0;}
body{
  min-width:320px;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  padding:24px;
}
main{max-width:1440px;margin:0 auto;}
.floating-context{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:15;
  background:rgba(248,241,228,.96);
  border-bottom:1px solid var(--line);
  box-shadow:0 8px 24px rgba(83,66,47,.12);
  color:var(--muted);
  font-size:13px;
  backdrop-filter:blur(14px);
  transform:translateY(-110%);
  opacity:0;
  pointer-events:none;
  transition:transform .18s ease,opacity .18s ease;
}
.floating-context.is-visible{
  transform:translateY(0);
  opacity:1;
  pointer-events:auto;
}
.floating-inner{
  max-width:1440px;
  margin:0 auto;
  padding:7px 24px;
}
.floating-row{
  display:flex;
  align-items:center;
  gap:20px;
  min-height:36px;
  border-bottom:1px solid rgba(217,205,187,.78);
}
.floating-row:last-child{border-bottom:0;}
.floating-label{
  flex:0 0 82px;
  font-weight:500;
  color:#93897c;
  white-space:nowrap;
}
.floating-options{
  display:flex;
  align-items:center;
  gap:18px;
  min-width:0;
  overflow-x:auto;
  padding:2px 0;
  scrollbar-width:none;
}
.floating-options::-webkit-scrollbar{display:none;}
.floating-option{
  appearance:none;
  border:0;
  background:transparent;
  color:#5f574f;
  font:inherit;
  font-size:13px;
  font-weight:500;
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:30px;
  border-radius:999px;
  padding:0 2px;
  cursor:pointer;
  white-space:nowrap;
}
.floating-option[aria-pressed="true"]{
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-height:32px;
  padding:0 14px;
  border-radius:999px;
  background:var(--dark);
  color:#fff;
  font-weight:500;
}
.floating-option-count{font-variant-numeric:tabular-nums;}
.floating-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  flex:0 0 auto;
  background:var(--floating-color,var(--accent));
}
.floating-dot.all{
  border:2px solid #a39b92;
  background:conic-gradient(#d26f3b 0 25%,#8583e6 0 50%,#5fbf78 0 75%,#e3c85d 0);
}
.hero{
  border-bottom:1px solid var(--line);
  padding-bottom:18px;
  margin-bottom:22px;
}
h1{font-size:34px;font-weight:500;line-height:1.18;color:var(--ink);}
.title-accent{color:#c86627;}
.toolbar{
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  padding:0 0 16px;
}
.toolbar-label{
  font-size:16px;
  font-weight:500;
  color:#93897c;
  white-space:nowrap;
}
.format-buttons{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.format-btn{
  appearance:none;
  border:0;
  background:transparent;
  color:#514b45;
  font:inherit;
  font-size:15px;
  font-weight:400;
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-height:38px;
  cursor:pointer;
  border-radius:24px;
  padding:0 2px;
}
.format-btn[aria-pressed="true"]{
  background:var(--dark);
  color:#fff;
  padding:0 17px;
  font-weight:500;
}
.dot{
  width:13px;
  height:13px;
  border-radius:50%;
  flex:0 0 auto;
  background:var(--dot);
}
.dot.all{
  border:2px solid #a39b92;
  background:conic-gradient(#d26f3b 0 25%,#8583e6 0 50%,#5fbf78 0 75%,#e3c85d 0);
}
.metric-line{
  display:flex;
  align-items:baseline;
  gap:16px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:15px;
  margin-bottom:12px;
}
.metric-line b{font-size:28px;font-weight:500;color:var(--accent);}
.layout{
  margin-bottom:24px;
  display:flex;
  justify-content:flex-start;
}
.viz-wrap{
  width:min(50vw,720px);
  min-width:520px;
}
.treemap{
  position:relative;
  width:100%;
  aspect-ratio:1.05/1;
  max-height:620px;
  min-height:0;
  background:transparent;
  overflow:hidden;
}
.scene-tile{
  position:absolute;
  border-style:solid;
  border-color:#f3efb5;
  border-width:var(--tile-border-top,var(--tile-gap)) var(--tile-border-right,var(--tile-gap)) var(--tile-border-bottom,var(--tile-gap)) var(--tile-border-left,var(--tile-gap));
  border-radius:8px;
  padding:14px 16px;
  text-align:left;
  color:var(--tile-fg);
  background:var(--tile-bg);
  cursor:pointer;
  overflow:hidden;
  transition:filter .15s,transform .15s,box-shadow .15s;
}
.scene-tile:hover{filter:saturate(1.04) brightness(1.02);}
.scene-tile.is-selected{
  box-shadow:inset 0 0 0 4px rgba(45,41,37,.38);
}
.scene-name{
  display:block;
  font-size:22px;
  font-weight:500;
  line-height:1.16;
  word-break:keep-all;
  overflow-wrap:break-word;
}
.scene-value{
  display:block;
  font-size:17px;
  font-weight:400;
  line-height:1.35;
  margin-top:7px;
  font-variant-numeric:tabular-nums;
  opacity:.92;
}
.scene-tile.is-compact{padding:12px 14px;}
.scene-tile.is-compact .scene-name{font-size:17px;}
.scene-tile.is-compact .scene-value{font-size:14px;margin-top:4px;}
.cards-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  border-top:1px solid var(--line);
  padding-top:18px;
  margin-bottom:12px;
}
#cardsSection{scroll-margin-top:106px;}
.cards-title{font-size:24px;font-weight:500;}
.cards-meta{font-size:15px;color:var(--muted);}
.clear-btn{
  appearance:none;
  border:1px solid var(--line);
  background:transparent;
  color:var(--accent-dark);
  border-radius:20px;
  padding:7px 14px;
  font:inherit;
  cursor:pointer;
}
.clear-btn[hidden]{display:none;}
.cards-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(206px,1fr));
  gap:14px;
}
.drink-card{
  background:var(--panel-2);
  border:1px solid var(--line-soft);
  border-radius:8px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.thumb{
  position:relative;
  aspect-ratio:3/4;
  background:#efe6d2;
  cursor:zoom-in;
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.card-id{display:none!important;}
.drink-body{padding:12px;display:flex;flex-direction:column;gap:8px;}
.badges{display:flex;flex-wrap:wrap;gap:5px;}
.badge{
  display:inline-flex;
  align-items:center;
  min-height:22px;
  border-radius:5px;
  padding:2px 7px;
  font-size:12px;
  font-weight:500;
  color:var(--ink);
  background:#eadfc8;
}
.badge.scene{background:#e8d3bd;color:#70452d;}
.badge.format{background:#dedbf2;color:#383461;}
.badge.place{background:#dfebd7;color:#3c633e;}
.desc{
  color:#686158;
  font-size:13px;
  line-height:1.55;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(27,24,22,.86);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20;
  padding:24px;
  cursor:zoom-out;
}
.lightbox img{
  max-width:92vw;
  max-height:92vh;
  border-radius:8px;
  box-shadow:0 18px 48px rgba(0,0,0,.35);
}
@media(max-width:980px){
  body{padding:18px;}
  .layout{display:block;}
  .viz-wrap{width:100%;max-width:none;min-width:0;}
  .treemap{aspect-ratio:1.35/1;min-height:340px;max-height:none;}
}
@media(max-width:560px){
  body{padding:14px;}
  h1{font-size:28px;}
  .toolbar{gap:12px;}
  .format-buttons{gap:11px;}
  .format-btn{font-size:14px;min-height:38px;}
  .format-btn[aria-pressed="true"]{padding:0 14px;}
  .treemap{min-height:420px;aspect-ratio:.9/1;}
  .scene-tile{padding:10px;}
  .scene-name{font-size:17px;}
  .scene-value{font-size:14px;}
  .cards-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .floating-context{
    font-size:13px;
  }
  .floating-inner{padding:6px 14px;}
  .floating-row{
    gap:10px;
    min-height:38px;
  }
  .floating-label{flex:0 0 66px;}
  .floating-option[aria-pressed="true"]{
    min-height:30px;
    padding:0 12px;
  }
  #cardsSection{scroll-margin-top:98px;}
}
</style>
</head>
<body>
<div class="floating-context" id="floatingContext" aria-live="polite">
  <div class="floating-inner">
    <div class="floating-row">
      <span class="floating-label">场景视角</span>

</div>
<main>

  <section class="layout">
    <div class="viz-wrap">

  </section>

  <section id="cardsSection">
    <div class="cards-head">
      <div>

      <button class="clear-btn" type="button" data-clear-scene hidden>查看全部场景</button>
    </div>
    <div class="cards-grid" id="cardsGrid"></div>
  </section>
</main>

<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

let activeFormat="全部";

function esc(value){
  return String(value == null ? "" : value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}
function labelFormat(value){
  return value === "瓶装饮品" ? "瓶装" : value;
}
function currentFormat(){
  return FORMATS.find(format => format.key === activeFormat) || FORMATS[0];
}
function setFormat(key){
  activeFormat=key;
  if(selectedScene && !filteredByFormat().some(card => card.t === selectedScene)) selectedScene="";
  render();
}
function scrollToCards(){
  requestAnimationFrame(()=>document.getElementById("cardsSection").scrollIntoView({behavior:"smooth",block:"start"}));
}
function filteredByFormat(){
  return activeFormat === "全部" ? RAW : RAW.filter(card => card.c === activeFormat);
}
function activeCards(){
  const cards=filteredByFormat();
  return selectedScene ? cards.filter(card => card.t === selectedScene) : cards;
}
function countsByScene(cards){
  return SCENES.map(scene => ({
    scene,
    n:cards.filter(card => card.t === scene).length
  })).filter(item => item.n > 0);
}
function textColor(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return (r*299 + g*587 + b*114) / 1000 > 164 ? "#332d27" : "#fff";
}
function floatingOptionHTML({kind,key,label,count,color,active,all}){
  const dataAttr=kind === "scene" ? "data-scene-option" : "data-format-option";
  const dotClass=all ? "floating-dot all" : "floating-dot";
  const style=color ? ` style="--floating-color:${color}"` : "";
  return `<button class="floating-option" type="button" ${dataAttr}="${esc(key)}" aria-pressed="${active}"${style}>
    <span class="${dotClass}"></span><span>${esc(label)}</span><span class="floating-option-count">${count}</span>
  </button>`;
}
function splitBalanced(items){
  const total=items.reduce((sum,item)=>sum+item.n,0);
  const half=total/2;
  const left=[];
  const right=[];
  let acc=0;
  items.forEach(item=>{
    if(acc < half || left.length === 0){
      left.push(item);
      acc += item.n;
    }else{
      right.push(item);
    }
  });
  if(right.length === 0 && left.length > 1) right.push(left.pop());
  return [left,right];
}
function binaryTreemap(items,x,y,w,h,out){
  if(!items.length) return out;
  if(items.length === 1){
    out.push({...items[0],x,y,w,h});
    return out;
  }
  const [left,right]=splitBalanced(items);
  const leftTotal=left.reduce((sum,item)=>sum+item.n,0);
  const total=items.reduce((sum,item)=>sum+item.n,0);
  if(w >= h){
    const w1=w * leftTotal / total;
    binaryTreemap(left,x,y,w1,h,out);
    binaryTreemap(right,x+w1,y,w-w1,h,out);
  }else{
    const h1=h * leftTotal / total;
    binaryTreemap(left,x,y,w,h1,out);
    binaryTreemap(right,x,y+h1,w,h-h1,out);
  }
  return out;
}
function renderFormatButtons(){
  const host=document.getElementById("formatButtons");
  const allCount=RAW.length;
  host.innerHTML=FORMATS.map(format=>{
    const isActive=format.key === activeFormat;
    const n=format.key === "全部" ? allCount : RAW.filter(card => card.c === format.key).length;
    const dot=format.key === "全部"
      ? '<span class="dot all"></span>'
      : `<span class="dot" style="--dot:${format.dot}"></span>`;
    return `<button class="format-btn" type="button" data-format="${esc(format.key)}" aria-pressed="${isActive}">${dot}<span>${esc(format.label)}</span><span>${n}</span></button>`;
  }).join("");
  host.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click",()=>{
      setFormat(btn.dataset.format);
    });
  });
}
function renderTreemap(cards){
  const host=document.getElementById("sceneMap");
  const items=countsByScene(cards);
  const total=items.reduce((sum,item)=>sum+item.n,0);
  const sorted=[...items].sort((a,b)=>b.n-a.n);
  const rects=binaryTreemap(sorted,0,0,100,100,[]);
  host.innerHTML=rects.map(rect=>{
    const color=SCENE_COLORS.get(rect.scene) || "#c7b9a3";
    const fg=textColor(color);
    const pct=total ? Math.round(rect.n/total*100) : 0;
    const compact=rect.w < 22 || rect.h < 18 ? " is-compact" : "";
    const selected=selectedScene === rect.scene ? " is-selected" : "";
    const top=rect.y <= 0.01 ? 0 : "var(--tile-gap)";
    const left=rect.x <= 0.01 ? 0 : "var(--tile-gap)";
    const right=rect.x + rect.w >= 99.99 ? 0 : "var(--tile-gap)";
    const bottom=rect.y + rect.h >= 99.99 ? 0 : "var(--tile-gap)";
    return `<button class="scene-tile${compact}${selected}" type="button" data-scene="${esc(rect.scene)}" style="left:${rect.x}%;top:${rect.y}%;width:${rect.w}%;height:${rect.h}%;--tile-bg:${color};--tile-fg:${fg};--tile-border-top:${top};--tile-border-right:${right};--tile-border-bottom:${bottom};--tile-border-left:${left};" aria-pressed="${selectedScene===rect.scene}">
      <span class="scene-name">${esc(rect.scene)}</span>
      <span class="scene-value">${rect.n} · ${pct}%</span>
    </button>`;
  }).join("");
  host.querySelectorAll(".scene-tile").forEach(tile=>{
    tile.addEventListener("click",()=>{
      selectedScene = selectedScene === tile.dataset.scene ? "" : tile.dataset.scene;
      render();
      scrollToCards();
    });
  });
}
function cardHTML(card){
  const brand=card.b ? `<span class="badge">${esc(card.b)}</span>` : "";
  return `<article class="drink-card">
    <div class="thumb" data-img="${esc(card.img)}"><img loading="lazy" src="${esc(card.img)}" alt=""></div>
    <div class="drink-body">
      <div class="badges"><span class="badge scene">${esc(card.t)}</span><span class="badge format">${esc(labelFormat(card.c))}</span><span class="badge place">${esc(card.city)} · ${esc(card.p)}</span>${brand}</div>
      <div class="desc" title="${esc(card.d)}">${esc(card.d)}</div>
    </div>
  </article>`;
}
function renderCards(){
  const cards=activeCards();
  const title=document.getElementById("cardsTitle");
  const meta=document.getElementById("cardsMeta");
  const titlePrefix=selectedScene || "全部";
  title.innerHTML=`<span class="title-accent">${esc(titlePrefix)}</span>奶茶场景`;
  meta.textContent=`${cards.length} 张`;
  document.querySelectorAll("[data-clear-scene]").forEach(btn=>{
    btn.hidden=!selectedScene;
  });
  document.getElementById("cardsGrid").innerHTML=cards.map(cardHTML).join("");
  document.querySelectorAll(".thumb").forEach(thumb=>{
    thumb.addEventListener("click",()=>zoom(thumb.dataset.img));
  });
}
function renderFloatingContext(cards){
  const sceneHost=document.getElementById("floatingSceneOptions");
  const formatHost=document.getElementById("floatingFormatOptions");
  const sceneItems=[
    {kind:"scene",key:"",label:"全部场景",count:cards.length,active:!selectedScene,all:true},
    ...countsByScene(cards).map(item=>({
      kind:"scene",
      key:item.scene,
      label:item.scene,
      count:item.n,
      color:SCENE_COLORS.get(item.scene),
      active:selectedScene === item.scene
    }))
  ];
  sceneHost.innerHTML=sceneItems.map(floatingOptionHTML).join("");
  sceneHost.querySelectorAll("[data-scene-option]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      selectedScene=btn.dataset.sceneOption;
      render();
      scrollToCards();
    });
  });

  const formatBase=selectedScene ? RAW.filter(card => card.t === selectedScene) : RAW;
  const formatItems=FORMATS.map(format=>({
    kind:"format",
    key:format.key,
    label:format.label,
    count:format.key === "全部" ? formatBase.length : formatBase.filter(card => card.c === format.key).length,
    color:format.dot,
    active:format.key === activeFormat,
    all:format.key === "全部"
  }));
  formatHost.innerHTML=formatItems.map(floatingOptionHTML).join("");
  formatHost.querySelectorAll("[data-format-option]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      setFormat(btn.dataset.formatOption);
      scrollToCards();
    });
  });
}
function syncFloatingVisibility(){
  const bar=document.getElementById("floatingContext");
  const cards=document.getElementById("cardsSection");
  if(!bar || !cards) return;
  bar.classList.toggle("is-visible",cards.getBoundingClientRect().top <= 110);
}
function zoom(src){
  const box=document.getElementById("lightbox");
  document.getElementById("lightboxImg").src=src;
  box.style.display="flex";
}
function render(){
  renderFormatButtons();
  const cards=filteredByFormat();
  document.getElementById("totalCount").textContent=cards.length;
  document.getElementById("currentScope").textContent=currentFormat().label;
  renderFloatingContext(cards);
  renderTreemap(cards);
  renderCards();
  syncFloatingVisibility();
}
document.querySelectorAll("[data-clear-scene]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    selectedScene="";
    render();
  });
});
document.getElementById("lightbox").addEventListener("click",event=>{
  event.currentTarget.style.display="none";
});
window.addEventListener("scroll",syncFloatingVisibility,{passive:true});
window.addEventListener("resize",syncFloatingVisibility);
document.addEventListener("DOMContentLoaded",render);
</script>
</body>
</html>
