    gap: 6px 16px; align-items: start;
  }
  .toc-label {
    color: #999; font-size: 12px; padding-top: 5px; text-align: right;
    line-height: 1.4; white-space: nowrap;
  }
  .toc-row {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .toc-row a {
    text-decoration: none; padding: 4px 10px; border-radius: 14px;
    background: #f0ede8; color: #555; font-size: 12px;
  }
  .toc-row a:hover { background: #e3dfd6; }
  .toc-row a.other { background: #ffe9e9; color: #c44; }
  .toc-label.other { color: #c88; }
  main { padding: 24px 32px 80px; max-width: 1400px; margin: 0 auto; }

  .mega {
    display: grid; grid-template-columns: 110px 1fr; gap: 22px;
    margin-bottom: 18px; align-items: start;
  }
  .mega-label {
    color: #999; font-size: 13px; font-weight: 400;

  .mega.other .mega-label { color: #c88; }
  .mega-subs {
    display: flex; flex-direction: column; gap: 10px;
  }

  }
  .cat h3 {
    margin: 0 0 10px; font-size: 14px; font-weight: 600; display: flex;
    align-items: baseline; gap: 10px; color: #444;
  }
  .cat h3 .total { color: #888; font-size: 11px; font-weight: 400; }
  .cat.other h3 { color: #c44; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: #f5f1ec; color: #444; padding: 4px 10px; border-radius: 14px;
    font-size: 13px; cursor: pointer; border: 1px solid transparent;
    transition: all 0.1s;
  }
  .chip:hover { background: #e8e1d6; border-color: #c8b89c; }
  .chip .n { color: #888; font-size: 11px; margin-left: 4px; }
  .chip.high .n { color: #b8860b; font-weight: 600; }

  /* lightbox */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100;
    display: none; align-items: flex-start; justify-content: center;
    padding: 40px 20px; overflow-y: auto;
  }
  .lightbox.show { display: flex; }
  .lightbox-inner {
    background: #fff; border-radius: 12px; max-width: 1200px; width: 100%;
    padding: 24px; position: relative;
  }
  .lightbox h3 {
    margin: 0 0 4px; font-size: 18px;
  }
  .lightbox .meta { color: #888; font-size: 12px; margin-bottom: 16px; }
  .lightbox .close {
    position: absolute; right: 16px; top: 12px; cursor: pointer; font-size: 24px;
    color: #999; background: none; border: none;
  }
  .lightbox .close:hover { color: #333; }
  .source-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .source-card {
    border: 1px solid #e8e3da; border-radius: 8px; overflow: hidden; background: #fdfcf9;
    display: flex; flex-direction: column;
  }
  .source-card img {

  .source-card .body { padding: 10px 12px; font-size: 12px; line-height: 1.6; }
  .source-card .id { color: #888; font-size: 10px; margin-bottom: 4px; }
  .source-card .desc { padding: 6px 8px; border-radius: 4px; margin-top: 4px; }
  .source-card .scene { background: #f3faf7; border-left: 3px solid #b3d9c6; }
  .source-card .drink { background: #fff8eb; border-left: 3px solid #ffd9a8; }
  .source-card .note  { background: #fef0f0; border-left: 3px solid #f5b5b5; }
  .source-card mark { background: #ffe066; padding: 0 2px; border-radius: 2px; }
  .image-zoom {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }

  .image-zoom img { max-width: 95%; max-height: 95vh; }

中产无娃-上海-D02": {"id": "中产无娃-上海-D02", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/其他.png", "scene_text": "早上来公司吃早餐的时候", "drink_desc": "公司有咖啡机可以打热牛奶，所以每天早上上班就习惯喝一杯热牛奶，又方便不会迟到又健康...", "note": "欢迎积极分享"}, "中产无娃-上海-D03": {"id": "中产无娃-上海-D03", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-1.png", "scene_text": "中午和同事逛街时想喝点甜的，但又是不希望发胖，苹果小奶茶满足我的味蕾", "drink_desc": "便利店的苹果小奶茶很方便携带，和同事逛街也可以在办公室继续喝", "note": "苹果味很浓郁，不会有很甜腻的感觉，是减脂朋友的很好的选择"}, "中产无娃-上海-D04": {"id": "中产无娃-上海-D04", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-10.png", "scene_text": "周中加班需要提神，口感要重口味，味道要非常苦涩和浓郁", "drink_desc": "从小就喝乌龙茶，前几年有这种小瓶的黑乌龙，口感更加苦涩振奋人心", "note": "近些年一直接触新的茶种，比如岩茶、白茶等，冬天喝茶还是非常像功夫茶，越热越好"}, "中产无娃-上海-D05": {"id": "中产无娃-上海-D05", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-11.png", "scene_text": "和老婆去青浦太阳岛度假区玩越野卡丁车，超级刺激和疯狂", "drink_desc": "非常清甜口味，浓郁芳香，加热后更加的香甜可口。", "note": "喜茶去年的就喝了三倍厚抹茶的瓶装，山姆买的，一直会关注他的所有产品系列，非常值得冬天去喝热的。"}, "中产无娃-上海-D06": {"id": "中产无娃-上海-D06", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-12.png", "scene_text": "和朋友去看线下魔术，近景表现非常夸张和真实", "drink_desc": "茉莉的诱人香气沁人心脾，一般暖流下肚非常提神，很温暖", "note": "牛奶茶非常适合冬日暖阳，在温暖的气圈中传递能量"}, "中产无娃-上海-D07": {"id": "中产无娃-上海-D07", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-13.png", "scene_text": "冬天早晨会比较想喝热的奶类产品", "drink_desc": "冬天早上比较想喝奶类的产品暖胃又能提神，带点甜味会有点多肚子分泌。", "note": "感觉奶类热饮选择不多，希望有更多其他口味奶或奶类的选择。"}, "中产无娃-上海-D08": {"id": "中产无娃-上海-D08", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-14.png", "scene_text": "冬季养生标配，润喉养肺利器。", "drink_desc": "冬天喝子喝都比较干，一般下午喝水喝茶都有点干渴情况，这个喝下去会回家润喉，不至于也比较养生。", "note": "养生的口感一般，有时候不太好入口，梨汤口感也很一般"}, "中产无娃-上海-D09": {"id": "中产无娃-上海-D09", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-15.png", "scene_text": "解腻神器又能提神", "drink_desc": "中午吃的油腻想要解腻，喝泡的茶会觉得液态，乌龙茶比较合适，解腻且提神，喝了没负担感", "note": "一直喝乌龙茶，但热饮没有其他口味选择，希望以后有新的小瓶饮乌龙茶，可选的味道多多益善"}, "中产无娃-上海-D10": {"id": "中产无娃-上海-D10", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-16.png", "scene_text": "一直努力了一个冬天的普拉提，柔韧性好了很多。", "drink_desc": "每次练完普拉提会出很多汗，但我需要补充一点能喝法温的养生茶，直接喝茶又会影响晚上睡...", "note": "养生好水，喝完没负担，又能养生，而且口感不奇怪，很顺滑很天然。"}, "中产无娃-上海-D11": {"id": "中产无娃-上海-D11", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-17.png", "scene_text": "每次冬天去迪士尼都会路过便利店带一瓶这个，甜甜的口感会让心情变好，而且可以补充一定...", "drink_desc": "每次冬天去迪士尼都会路过便利店带一瓶这个，甜甜的口感会让心情变好，而且可以补充一定...", "note": "口感上果味确实很不错，冬天喝柚子也是很不错的选择，会有点缓和和补维生素，但稍稍偏甜，回味就会有点腻。"}, "中产无娃-上海-D12": {"id": "中产无娃-上海-D12", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-18.png", "scene_text": "", "drink_desc": "睡前热牛奶，可以更好的帮助睡眠。", "note": "会特别选择有助于睡眠的牛奶。"}, "中产无娃-上海-D13": {"id": "中产无娃-上海-D13", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-19.png", "scene_text": "热红酒，针对情人节的气氛，和恋人一起喝醉。", "drink_desc": "热红酒，针对情人节的气氛，和恋人一起喝醉。", "note": "热红酒是这两年喜欢的新品种，觉得很有仪式感，气氛也很好可以做很多不同的口味。"}, "中产无娃-上海-D14": {"id": "中产无娃-上海-D14", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-2.png", "scene_text": "去重庆逛各种各样奇怪的小商店是我最放松的时候", "drink_desc": "正好去重庆逛街的时候，周围没有有什么特别想喝的，又很口渴，就治街便宜店买了瓶金银花水...", "note": "感觉这个是很解渴的，不会很甜，而且对喜欢喝者上火的时候效果很好"}, "中产无娃-上海-D15": {"id": "中产无娃-上海-D15", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-20.png", "scene_text": "在赶飞机，机场里的选择比较少，通常只有连锁店的咖啡。", "drink_desc": "在赶飞机，机场里的选择比较少，通常只有连锁店的咖啡。", "note": "机场的选择太少了，迫不得已选择了星巴克的咖啡，在市区的话不会选择喝这个品牌。"}, "中产无娃-上海-D16": {"id": "中产无娃-上海-D16", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-21.png", "scene_text": "带着狗狗去了宠物友好的餐厅，点了热茶和小蛋糕，和好友享受下午茶时光", "drink_desc": "热茶", "note": "如果在一堆做很久的话会选择一壶热茶，可以一直加热水的那种。"}, "中产无娃-上海-D17": {"id": "中产无娃-上海-D17", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-22.png", "scene_text": "在龙华寺的集市中", "drink_desc": "龙华寺知名特产：大将甘露", "note": "看到包装很吸引，也有寓意，很快就买了"}, "中产无娃-上海-D18": {"id": "中产无娃-上海-D18", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-23.png", "scene_text": "冬季早餐的时候一个人享热饮。", "drink_desc": "可可牛奶可以提供热量，玻璃瓶也方便加热，暖身暖心。", "note": "加热速度很快，玻璃瓶能够快速导热"}, "中产无娃-上海-D19": {"id": "中产无娃-上海-D19", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-24.png", "scene_text": "冬天感冒，生病的时候一个人挂水", "drink_desc": "小小的一个，去医院带着非常的方便，不占地方，同时也很方便加热", "note": "它的塑料比比较硬质，握在手上很有手感，会让我觉得是比较坚固，可以高温的"}, "中产无娃-上海-D20": {"id": "中产无娃-上海-D20", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-25.png", "scene_text": "零下的温度和朋友在日本旅行。", "drink_desc": "自助售货机里的产品感觉都是小包装的，拿在手里暖手很方便，特别旅行时吹冷风的时候很合适。", "note": "日本的自动售货机的热饮温度非常高，真的是很有暖手的感觉。"}, "中产无娃-上海-D21": {"id": "中产无娃-上海-D21", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-26.png", "scene_text": "在广州吃饭，吃完以后觉得需要喝的来解腻，又不想喝太好不容易暖和的身子。", "drink_desc": "黄杏加草本的组合，可以解腻，同时暖暖的也可以保护肚肠道一举两得。", "note": "塑料瓶比较薄，会有一些担心它的食品健康问题。"}, "中产无娃-上海-D22": {"id": "中产无娃-上海-D22", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-27.png", "scene_text": "跨年的夜晚一个人打游戏，有点饥饿，简单搭配零食，一个人的小确幸。", "drink_desc": "感觉加热以后的燕麦的质地会更加浓稠，热热的很暖胃，也有点饱腹感，作为夜宵比较健康。", "note": "风味有些少，多一些其他的植物蛋白风味会更加有仪式感。"}, "中产无娃-上海-D23": {"id": "中产无娃-上海-D23", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-3.png", "scene_text": "为了让自己减肥，25年理了几十箱证，觉得自己好厉害", "drink_desc": "财政整理凭证巨繁琐，搬完凭证后怒买了一瓶贝纳颂", "note": "贝纳颂稍微有点甜，但是毕竟是做了很久的咖啡品牌，味道还是很浓郁"}, "中产无娃-上海-D24": {"id": "中产无娃-上海-D24", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-4.png", "scene_text": "看剧、打游戏等休闲的时候总想喝点什么，吃点什么来助兴", "drink_desc": "因为是放松休闲的作用，所以一般会选小甜水，但是这款果茶又不会太甜也不至于太罪恶", "note": "欢迎激情分享"}, "中产无娃-上海-D25": {"id": "中产无娃-上海-D25", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-5.png", "scene_text": "在家睡前准备喝个牛奶帮助睡眠", "drink_desc": "睡前喝牛奶方便入睡，我一般会自己把瓶子放在热水里热一下，这样喝起来也不会伤胃", "note": "欢迎分享情感"}, "中产无娃-上海-D26": {"id": "中产无娃-上海-D26", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-6.png", "scene_text": "和老公去东京海洋迪士尼过圣诞节啦，特别有节日氛围，还买了圣诞限定头盔", "drink_desc": "因为要特别早出发，所以早餐就是在便利店买的，那时候已经比较冷，所以就买了比较适合...", "note": "欢迎积极分享"}, "中产无娃-上海-D27": {"id": "中产无娃-上海-D27", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-7.png", "scene_text": "跨年的时候和家人一起看跨年晚会，特别放松惬意", "drink_desc": "为了跨年晚会，准备了特别多的零食，包括吃的喝的，这个口味从来没喝过，感觉桃子味很好...", "note": "欢迎激情分享"}, "中产无娃-上海-D28": {"id": "中产无娃-上海-D28", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-8.png", "scene_text": "室内运动时，轻微微微出汗，需要暖身子快速热身完毕，排排湿气", "drink_desc": "喜欢茶又出新品，必须第一时间冲，运动娱乐场的暖饮桶第一时间尝鲜", "note": "非常棒的组合，就像蒸红酒里放橙子什么的，苹果本身就是暖意的代表，结合的口味很爽口"}, "中产无娃-上海-D29": {"id": "中产无娃-上海-D29", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-9.png", "scene_text": "在办公室坐着挺冷的，需要一些血气方刚的加持，并且每天两顿饭很养颜", "drink_desc": "口味养生茶，非常的弱的口感没有负担，微微甜的口感很润喉舒服", "note": "中式养生的概念已经很多年了，拼接茶饮慢慢丰富了，一直在尝试熟悉的配方"}, "中产无娃-上海-D30": {"id": "中产无娃-上海-D30", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品.png", "scene_text": "冬天的时候懒得出门就会叫朋友来家里做客，最喜欢给他们喝盒马的杏仁露", "drink_desc": "很大一瓶，可以用来招待朋友很好喝也很健康", "note": "无"}, "中产无娃-上海-D31": {"id": "中产无娃-上海-D31", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮料.png", "scene_text": "冬天起来有时候喝子不太舒服，有点感官的初步迹象，会在公司附近的冷茶铺买热的冷茶来喝", "drink_desc": "店里最好的热饮瓶子，从柜子拿出来的。有多种口味可以选。", "note": "会根据症状选择的，冬天会加热的，夏天会喝温或冷的。"}, "中产无娃-上海-D32": {"id": "中产无娃-上海-D32", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/自制饮品-1.png", "scene_text": "有时候早上起来上班很不知道吃啥的时候，就会冲泡一杯热的维维豆奶", "drink_desc": "早上喝豆奶可以补充蛋白质的需要，再配合面包或者煎头，一顿早餐轻松解决", "note": "适合全家人饮用的豆奶品牌，是很多家庭回购的很好的选择"}, "中产无娃-上海-D33": {"id": "中产无娃-上海-D33", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/自制饮品-2.png", "scene_text": "25年买了一个床头可以直接看剧的设备，对于懒癌的我来说可以躺平追剧了！", "drink_desc": "周末居家追剧的时候，给自己可拿铁，用维他奶和Moccona咖啡结合", "note": "这个结合建议让多人可以试试，咖啡味超浓液体，巧克力的味道也让人欲罢不能！"}, "中产无娃-上海-D34": {"id": "中产无娃-上海-D34", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/自制饮品-3.png", "scene_text": "去冰岛和老公度蜜月，南方孩子第一次看到全白的世界，还看到了冰川、露天...", "drink_desc": "那么冷的地方只能喝热的，让自己暖和起来，冰岛水都是可以直接喝的，所以每天都在酒店里烧好...", "note": "感觉除了咖啡店。冰岛就没有热饮的选项，只能自己烧开水"}, "中产无娃-上海-D35": {"id": "中产无娃-上海-D35", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/自制饮品-4.png", "scene_text": "居家时侯，自己一个人会根据身体情况和已有的东西，制作奇奇怪怪的饮品来满足自己奇奇和养生的...", "drink_desc": "生可可粉搭配中式药材", "note": "中西结合，五彩斑斓的苦味，后调也有一些回甘，就当美式去喝，很有创意"}, "中产无娃-上海-D36": {"id": "中产无娃-上海-D36", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/自制饮品-5.png", "scene_text": "有时候会在公司泡养生茶包，买的茶包含有养生美颜成分。", "drink_desc": "冬天是进补养生的时候，养生包是会定期购买然后饮用，也可以喝一天，这样工作也会有精神。", "note": "我主要是不喜欢喝白水，冬天养生茶也可以补身，而且在时不愿意楼下便利店买热饮的嘛。"}, "中产无娃-上海-D37": {"id": "中产无娃-上海-D37", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/自制饮品-6.png", "scene_text": "冬天周末在家，下午退刷的时候，会泡茶来喝，家里有很多朋友送的茶包", "drink_desc": "会根据心情选择红茶、绿茶、白茶，不一定都是每次喝一样的/", "note": "比较担心茶很多了晚上睡不着"}, "中产无娃-上海-D38": {"id": "中产无娃-上海-D38", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/自制饮品-7.png", "scene_text": "天冷一个人睡前准备暖暖身体。", "drink_desc": "豆浆机预定好的时间，在睡前可以马上喝到，不会花费太多精力", "note": "喝起来有一些残渣，相比直接买的瓶装可能需要更多的过滤"}, "中产无娃-上海-D39": {"id": "中产无娃-上海-D39", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/自制饮品-8.png", "scene_text": "天冷的时候，凛冬在办公室加班", "drink_desc": "办公室里面有热水，简单冲泡以后，可以让我迅速恢复精力，投入到工作", "note": "整体喝起来是比较方便，但是喝到第二、第三次加水的时候就没有什么味道了"}, "中产无娃-上海-D40": {"id": "中产无娃-上海-D40", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/自制饮品-9.png", "scene_text": "冬日假期的下午，和妈妈在家一起做烘焙", "drink_desc": "做烘焙已经很辛苦了，不想在饮料上花费太多的功夫，就直接冲泡了热饮。", "note": "可以提供咖啡的基本口味，但是是油脂感等就不能要求多"}, "中产无娃-上海-D41": {"id": "中产无娃-上海-D41", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/自制饮品.png", "scene_text": "姨妈来的第一天就是给自己煮一碗红枣茶，很暖", "drink_desc": "喝下去不会痛经了，肚里很舒服", "note": "很推荐明治的牛奶，奶味非常浓郁和红枣绝配"}, "中产无娃-上海-D42": {"id": "中产无娃-上海-D42", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/街饮-1.png", "scene_text": "去云南大理旅游，尝试了他们最有名的饵块，很香很好吃", "drink_desc": "去云南大理吃了她们比较出名的云南鲜花饼和饵块，正好看到朋友边有瑞幸，点了杯小黄油美式", "note": "无"}, "中产无娃-上海-D43": {"id": "中产无娃-上海-D43", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/街饮-10.png", "scene_text": "冬天和朋友约在咖啡馆吃点东西。", "drink_desc": "拍照比较有仪式感，在冬天的时候和朋友约着喝一杯很不错", "note": "它的形态只能在店里喝，不能把它带走，相对而言不是特别的方便"}, "中产无娃-上海-D44": {"id": "中产无娃-上海-D44", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/街饮-11.png", "scene_text": "冬天的周末，难得的好天气，买一杯咖啡，和朋友开车去郊游", "drink_desc": "有好看的杯子造型，艺术设计感，并且大小合适在车子的杯架上。", "note": "经常会有一些联名IP的杯子和杯套，比如好玩，有惊喜感"}, "中产无娃-上海-D45": {"id": "中产无娃-上海-D45", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/街饮-2.png", "scene_text": "过生日的时候店里给我整了个羊肉蛋糕，当时超级惊喜", "drink_desc": "过生日的那天，和男票去吃羊肉火锅，因为火锅比较辣，点了杯清爽的一点点", "note": "一点点的果茶还是很划算的，基本不会出错，热的苹果味道更加浓郁"}, "中产无娃-上海-D46": {"id": "中产无娃-上海-D46", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/街饮-3.png", "scene_text": "在公司，中午准备吃饭", "drink_desc": "中午习惯吃个简单的TIMS套餐，有喝的也有吃的，很满足，而且TIMS就在公司对面很方便", "note": "欢迎激情分享"}, "中产无娃-上海-D47": {"id": "中产无娃-上海-D47", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/街饮-4.png", "scene_text": "出差在外的时候，工作的同时也想喝点不一样的", "drink_desc": "平时出差比较多，喜欢到处尝试一些没有喝过的品牌奶茶，有新奇口味的我都愿意去尝试", "note": "欢迎积极分享"}, "中产无娃-上海-D48": {"id": "中产无娃-上海-D48", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/街饮-5.png", "scene_text": "冬天逛街肯定能看到小摊卖栗子，联想到暖暖的栗子，非常时令的组合", "drink_desc": "想试试甜加咸组合会不会有不同的口感和新奇", "note": "颜色很应急，能喝到焦糖的栗子，烤茶的深焙味很香气逼人，移动的甜品器皿"}, "中产无娃-上海-D49": {"id": "中产无娃-上海-D49", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/街饮-6.png", "scene_text": "去宁波一个人爬山逛古镇，体验独处的快乐。", "drink_desc": "爬山很累需要热量和多巴胺刺激我进发更好状态。", "note": "属于独立品牌的店，老板娘自创的一些搭配和口味，食材很适合暖饮。"}, "中产无娃-上海-D50": {"id": "中产无娃-上海-D50", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/街饮-7.png", "scene_text": "与同事一起点下午茶外卖。", "drink_desc": "请优先选择您喜欢的饮品，如果是外卖请注明包装。", "note": "虽然是不错的柠檬茶饮，但糖分也比较高，喝一次会有负罪感。"}, "中产无娃-上海-D51": {"id": "中产无娃-上海-D51", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/街饮-8.png", "scene_text": "最喜欢冬天吃冰淇淋", "drink_desc": "有时候街头citywalk买咖啡比较多，咖啡店也比较普遍。", "note": "咖啡在上海的普及率比较高，几乎十步内总有一个咖啡店，不管有没有名字，所以citywalk拿它是常规。"}, "中产无娃-上海-D52": {"id": "中产无娃-上海-D52", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/街饮-9.png", "scene_text": "外出，和朋友在餐厅吃饭，有时候会选择自己喜欢喝的热饮去吃饭嘛", "drink_desc": "选一种自己喜欢的口味，每次根据要吃的菜选择喝的奶茶。", "note": "没有固定的口味和品牌，可以选择的太多了，喜欢喝新鲜的。"}, "中产无娃-上海-D53": {"id": "中产无娃-上海-D53", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/街饮.png", "scene_text": "早上打工的牛马就适合来杯小黄油美式，特别是冬天，咖啡味非常浓郁", "drink_desc": "小黄油美式一直的瑞幸的招牌，经典的咖啡总是不会出错", "note": "小黄油美式永远yyds"}, "中产无娃-哈尔滨-D01": {"id": "中产无娃-哈尔滨-D01", "persona": "中产无娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产无娃-哈尔滨/其他-1.png", "scene_text": "2025年2月5日结婚纪念日。", "drink_desc": "平常喜欢在家自己做咖啡", "note": "在家自制咖啡比较方便"}, "中产无娃-哈尔滨-D02": {"id": "中产无娃-哈尔滨-D02", "persona": "中产无娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产无娃-哈尔滨/其他-2.png", "scene_text": "在外面想喝一点别的口味", "drink_desc": "热饮港式奶茶味道很好", "note": "现场制作的更好喝"}, "中产无娃-哈尔滨-D03": {"id": "中产无娃-哈尔滨-D03", "persona": "中产无娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产无娃-哈尔滨/其他-3.png", "scene_text": "2025年冬天开始喝林栖茶茶，为了摆鸭子换中鸭和大鸭。", "drink_desc": "买了个牛奶，单纯想试试温度热不热", "note": "还是咖啡更好喝点"}, "中产无娃-哈尔滨-D04": {"id": "中产无娃-哈尔滨-D04", "persona": "中产无娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产无娃-哈尔滨/其他-4.png", "scene_text": "下雪天自己一个人走在路上 雪越下越大根本打不到车 很冷 正往前走后面的人突然上前来把他...", "drink_desc": "不用煮 不用泡 超市暖瓶一拿就走 暖胃小帮手", "note": "加热的温度可以再高一些 这种奶我喜欢喝热一点的 口感会更好"}, "中产无娃-哈尔滨-D05": {"id": "中产无娃-哈尔滨-D05", "persona": "中产无娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产无娃-哈尔滨/其他-5.png", "scene_text": "夜深了冲一杯热牛奶 揉着温热的杯子小口喝着 奶香淡淡的一直滑到胃里 温暖又踏实", "drink_desc": "睡前我都会冲泡一杯牛奶 有助于睡眠", "note": "睡前一杯牛奶真的太幸福了 暖暖的滑进胃里 奶香又治愈 一天的疲惫全部释放 心情超级放松 入睡都感觉幸福直接满足"}, "中产无娃-哈尔滨-D06": {"id": "中产无娃-哈尔滨-D06", "persona": "中产无娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产无娃-哈尔滨/其他-6.png", "scene_text": "上班最期待的莫过于下午茶", "drink_desc": "下午茶时刻，必须来一杯热可 {"id": "中产无娃-广州-D06", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/其他.png", "scene_text": "过新年的时候，在特色菜馆吃饭。喝上暖暖的绿茶", "drink_desc": "请优先选择您喜欢的饮品，如果找不到自己拍的，可以贩卖图", "note": "传统粤式晚饭"}, "中产无娃-广州-D07": {"id": "中产无娃-广州-D07", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/瓶装饮品-1.png", "scene_text": "冬天的早上，喝上了在山姆买的热豆浆作为早餐", "drink_desc": "在早上喝上热豆浆给一天都充满了容量和营养，丰富的蛋白质能补充营养，又能暖身体", "note": "冬天来一杯热豆浆特别舒服。热乎乎下肚，暖心又暖胃，日常喝简单又实在。"}, "中产无娃-广州-D08": {"id": "中产无娃-广州-D08", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/瓶装饮品-2.png", "scene_text": "今年除了跟朋友去花市，看到很有趣的摊香，我和朋友都觉得很有趣", "drink_desc": "在花市的时候，外面很冷，买了一瓶热瓶装乌龙，拿着喝了半瓶，手和肚子都暖过来了。", "note": "这款茶是无糖茶，而且瓶子还能一起加热，可以暖喝起来也没负担"}, "中产无娃-广州-D09": {"id": "中产无娃-广州-D09", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/瓶装饮品-3.png", "scene_text": "每次经过便利店都会看一下有什么饮品", "drink_desc": "冬天喝过红豆燕米水超级养生舒服，肚肚暖的", "note": "冬天喝很养生，但是有代糖"}, "中产无娃-广州-D10": {"id": "中产无娃-广州-D10", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/瓶装饮品-4.png", "scene_text": "我和朋友吃火锅", "drink_desc": "自在水，因为火锅很燥，需要和茶饮解腻", "note": "红豆薏米很好养生，而且入口不错，不过是代糖"}, "中产无娃-广州-D11": {"id": "中产无娃-广州-D11", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/瓶装饮品-5.png", "scene_text": "在老婆生日的时候给她买金子，也是单价最高的时候，送她一个惊喜", "drink_desc": "平时也喜欢喝奶茶，逛商场带瓶装比较方便", "note": "瓶装奶茶方便逛街，随时可以起盖来放好"}, "中产无娃-广州-D12": {"id": "中产无娃-广州-D12", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/瓶装饮品-6.png", "scene_text": "摇摆访客的路上，喝一瓶热饮让自己充满活力。", "drink_desc": "瑞幸的咖啡热饮总是让人流连忘返，习惯了喝瑞幸", "note": "瑞幸的热饮，咖啡豆非常正宗，而且喝起来提神"}, "中产无娃-广州-D13": {"id": "中产无娃-广州-D13", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/瓶装饮品-7.png", "scene_text": "最冷的一天，在朋友家过圣诞节，很开心，布置的很精致", "drink_desc": "卡布奇诺，高级版满满，配合圣诞绝配", "note": "圣诞节的气氛，加上热饮配合这个冬天暖的回忆"}, "中产无娃-广州-D14": {"id": "中产无娃-广州-D14", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/瓶装饮品-8.png", "scene_text": "古老请了吴彦祖做代言人，做起了饮料，真好喝。", "drink_desc": "古老 desc": "轻轻抿一口，热水滑过喉咙，带着微微的暖意，仿佛把冬日的冰冷都融化在了这小小的杯盏里", "note": "舌底泛起甜味，喉液分泌增加"}, "中产无娃-广州-D24": {"id": "中产无娃-广州-D24", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/自制饮品-7.png", "scene_text": "我家人一起在家布置春节装饰时感觉很温暖很暖心", "drink_desc": "捧起一杯刚烧开的热茶，指尖触到杯壁的瞬间，一般温热的暖流便顺着指尖蔓延至全身，驱散了寒意。", "note": "茶水顺滑，喝起来很舒服"}, "中产无娃-广州-D25": {"id": "中产无娃-广州-D25", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/自制饮品-8.png", "scene_text": "工作中咖啡需要提神", "drink_desc": "苦", "note": "工作中咖啡需要提神"}, "中产无娃-广州-D26": {"id": "中产无娃-广州-D26", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/自制饮品-9.png", "scene_text": "和老婆度过圣诞节", "drink_desc": "圣诞节天气冷在外面餐厅点了个红枣姜茶", "note": "热饮可以照顾女性情绪一下，需求量比较多"}, "中产无娃-广州-D27": {"id": "中产无娃-广州-D27", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/自制饮品.png", "scene_text": "在冬天，晚上喝上一杯暖暖的牛奶，睡眠质量就很好", "drink_desc": "自己冲调的牛奶", "note": "欢迎激情分享"}, "中产无娃-广州-D28": {"id": "中产无娃-广州-D28", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/街饮-1.png", "scene_text": "周末加班前，一杯绿茶奶盖，自己给自己打打气", "drink_desc": "周末加班的早上，路过街边的手冲咖啡奶盖", "note": "欢迎积极分享"}, "中产无娃-广州-D29": {"id": "中产无娃-广州-D29", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/街饮-10.png", "scene_text": "买了自己喜欢的阿玛尼手链，给自己对自己2025年的奖励", "drink_desc": "维他奶经典的回忆。", "note": "维他奶，老品牌，百喝不厌。"}, "中产无娃-广州-D30": {"id": "中产无娃-广州-D30", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/街饮-2.png", "scene_text": "街边，也要来一杯星巴克", "drink_desc": "黑巧拿铁", "note": "欢迎激情分享"}, "中产无娃-广州-D31": {"id": "中产无娃-广州-D31", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/街饮-3.png", "scene_text": "几位同事坐一起共饮，暖心又放松气氛特别好。", "drink_desc": "冬日喝杯热奶茶暖暖身子，和同事一起忙里偷闲，轻松又惬意。", "note": "天冷来杯霸茶姬热饮，茶香浓厚不甜腻，和同事一起喝特别舒服。"}, "中产无娃-广州-D32": {"id": "中产无娃-广州-D32", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/街饮-4.png", "scene_text": "每次经过都会看到他们的冬日主题会被吸引到", "drink_desc": "热的可可奶茶很浓郁，甜而不腻", "note": "冬天喝可可奶茶很有冬天气氛，很温暖，而且香香的甜甜巧克力味道"}, "中产无娃-广州-D33": {"id": "中产无娃-广州-D33", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/街饮-5.png", "scene_text": "过年和家人一起旅游油菜花田，在万物复苏的冬日，能避逃一片金黄灿...", "drink_desc": "在油菜花田喝着琥珀奶茶，超级有意思，冷风吹来，带着琥珀和奶香很有感觉", "note": "很适合合冬天，尤其是在户外养膏而且花香十足"}, "中产无娃-广州-D34": {"id": "中产无娃-广州-D34", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/街饮-6.png", "scene_text": "朋友婚礼", "drink_desc": "瓶装雀巢提神", "note": "购买方便"}, "中产无娃-广州-D35": {"id": "中产无娃-广州-D35", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/街饮-7.png", "scene_text": "", "drink_desc": "吃早餐喝热饮", "note": "吃早餐喝热饮"}, "中产无娃-广州-D36": {"id": "中产无娃-广州-D36", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/街饮-8.png", "scene_text": "", "drink_desc": "热咖啡", "note": "热咖啡对职场人经常喝，拍照也好看"}, "中产无娃-广州-D37": {"id": "中产无娃-广州-D37", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/街饮-9.png", "scene_text": "围炉煮茶，跟三两好朋友坐在一起喝着热饮聊天也是非常惬意。", "drink_desc": "自带的茶叶然后泡茶吃点小点心跟朋友三两好一起是非常惬意，配合热茶的暖意。", "note": "围炉煮茶，自带的茶叶然后泡茶吃点小点心跟朋友三两好一起是非常惬意，配合热茶的暖意。"}, "中产无娃-广州-D38": {"id": "中产无娃-广州-D38", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/饮品卡/中产无娃-广州/街饮.png", "scene_text": "生日，小聚会后，自己给自己满上了一杯热热的拿铁", "drink_desc": "拿铁", "note": "欢迎积极分享"}, "中产无娃-成都-D01": {"id": "中产无娃-成都-D01", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/其他-1.png", "scene_text": "冬天周末休息的时候，在家里感觉很冷，想喝一些暖和的东西，又刚好到饭点，于是煮了汤来喝", "drink_desc": "猪肉汤味", "note": "喝起来自汤是真的鲜，喝一口感觉身体就暖和了，里面的肉吃起来也很好香"}, "中产无娃-成都-D02": {"id": "中产无娃-成都-D02", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/其他.png", "scene_text": "日常白开水何时何地都可以饮用", "drink_desc": "能解渴，给人体补充水分", "note": "万物的神，生命质量的基础"}, "中产无娃-成都-D03": {"id": "中产无娃-成都-D03", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/瓶装饮品-1.png", "scene_text": "冬天待家里的时候会自己一锅煮，因为吃多了口味会有点重，配上一杯热饮就刚好，安安静静宅在家里，温暖又惬意", "drink_desc": "农夫山泉打奶茶低糖，配料是真牛奶和原叶茶，没有乱七八糟的添加剂。", "note": "冬日空气干燥，长时间走路，看书或者逛街的时候喝的时常觉得很容易发干，我很爱喝，解渴又养人。"}, "中产无娃-成都-D04": {"id": "中产无娃-成都-D04", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/瓶装饮品-10.png", "scene_text": "那天好像是冬至，和爱人一起去吃了一顿烤羊排，浑身暖和", "drink_desc": "当时吃的有点腻了，所以去便利店买了一瓶这个柚香乌龙茶解腻", "note": "我发现茶类的饮品加热后味道更浓厚了，挺好喝的。"}, "中产无娃-成都-D05": {"id": "中产无娃-成都-D05", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/瓶装饮品-11.png", "scene_text": "我的爱人过生日，给他选了一个小蛋糕，我们度过了一个快乐的生日", "drink_desc": "当时过生日时吃的凉菜，吃完后有点口干舌燥了，所以想喝点暖的，甜甜的", "note": "这个饮品也适合加热喝"}, "中产无娃-成都-D06": {"id": "中产无娃-成都-D06", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/瓶装饮品-2.png", "scene_text": "冬天上下班通勤路上，我都会在地铁口附近的超市买瓶的慧米红豆水。可以替代热牛奶和豆浆，喝起来觉得可以提高代谢，清淡顺口。", "drink_desc": "慧米红豆水可以缓解浮肿燥热，温和养生，适合日常工作前来一瓶，调养我即将受冻残的身体", "note": "投入工作前，推荐大家喝上一杯温热的红豆米水能抵平浮肿。既能补水消肿，舒缓身体即将来的疲惫～以清爽适应的状态投入一天的工作"}, "中产无娃-成都-D07": {"id": "中产无娃-成都-D07", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/瓶装饮品-3.png", "scene_text": "圣诞节那天，我和好朋友一起去了万象城。橱窗里挂满彩灯，到处都是温暖的节日气氛。我们一边逛街、吃甜品、喝热饮，开心地度过了温馨的一天。", "drink_desc": "淡雅的玫瑰乌龙口感清新又解腻。还是零糖的，冬天温热着喝，清甜舒缓，喝起...", "note": "配料表也很干净，只有水、茶叶、玫瑰浓缩液和少量维生素C，喝着放心。"}, "中产无娃-成都-D08": {"id": "中产无娃-成都-D08", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/瓶装饮品-4.png", "scene_text": "我在工学院参加了插花课程，之后发现大家的插花作品被陈列在展览里。看着一件件精致好看的花艺作品，我认真拍照记录，这美好的学习回忆，一直记忆犹新。", "drink_desc": "百合麦冬", "note": "配料表简单单纯，零糖的，喝完整个人都放松了，把考虑、烦恼的疲惫缓解不少，意外的好喝，就一直记住这个味道。希望多出一些草本饮，真的很养生。"}, "中产无娃-成都-D09": {"id": "中产无娃-成都-D09", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/瓶装饮品-5.png", "scene_text": "冬天的基本上每天早上都会喝一杯热牛奶来唤醒新的一天的来临", "drink_desc": "每天早上用开水泡热牛奶，补足每天的蛋白含量，开启活力的一天", "note": "即使配送的鲜奶比茶菌奶更甜，营养价值更高"}, "中产无娃-成都-D10": {"id": "中产无娃-成都-D10", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/瓶装饮品-6.png", "scene_text": "当时还在成都SKP工地上班，冬天的晚上就突然下起了雪，成都很少下雪，还记得那天特别的冷。", "drink_desc": "当时走在街边时风很大，想喝一点温暖的东西来暖和身体，感觉甜甜热热的奶茶最适合了", "note": "味道品尝起来很好，甜味适中，很能暖和身体，激发身体的活力"}, "中产无娃-成都-D11": {"id": "中产无娃-成都-D11", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/瓶装饮品-7.png", "scene_text": "和朋友一起参加欢乐合唱节的万圣节狂欢日，里面的鬼屋特别可怕，里面的NPC特别敬业。", "drink_desc": "当时户外天气冷，有点困，我在便利店选择一个暖和又提神的饮品", "note": "拿铁咖啡的味道很丝滑，喝起来很舒服，提神效果也非常不错--"}, "中产无娃-成都-D12": {"id": "中产无娃-成都-D12", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/瓶装饮品-8.png", "scene_text": "与家人一起去农家乐吃紫火鸡，紫火鸡的味道很好，分量也很多，当天我打麻将也赢了钱", "drink_desc": "当时饭店里可以热豆奶，热豆奶可以在外面就餐时，解渴解辣", "note": "热豆奶起源来有很强的豆子味，奶味对豆子更加强烈，实属解辣神器"}, "中产无娃-成都-D13": {"id": "中产无娃-成都-D13", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/瓶装饮品-9.png", "scene_text": "平时用餐的时候", "drink_desc": "平时上班吃午饭的时候，如果吃的比较油腻，就喜欢喝一瓶东方树叶的红茶解腻", "note": "没有缺点"}, "中产无娃-成都-D14": {"id": "中产无娃-成都-D14", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/瓶装饮品.png", "scene_text": "看永乐大典展览，静静看着留下的古籍残卷，纸张古朴，字迹工整，搭配手中的草本热饮，觉得自己也在和古人对话", "drink_desc": "秋冬我经常嗓子不舒服。梨汤润喉，热饮喝着暖胃又润喉，清淡舒缓，喝完嗓子不会再咳嗽去", "note": "冬日空气干燥，长时间走路，看书或者逛街的时候嗓子很容易发干，我很爱喝，梨汤清甜润喉，解渴又养人。"}, "中产无娃-成都-D15": {"id": "中产无娃-成都-D15", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/自制饮品-1.png", "scene_text": "给两位同一天生日的朋友庆祝生日。我们一起吃了2个蛋糕，说说笑笑，延续大家6年的友谊，大...", "drink_desc": "和好朋友一起过生日那天，我们几个手残跟着视频菜手做了姜汁撞奶，简单用心的热饮，在那个冬日温热香甜，很有仪式感。围坐在一起聊天说笑，捧着也很暖...", "note": "欢迎激情分享"}, "中产无娃-成都-D16": {"id": "中产无娃-成都-D16", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/自制饮品-2.png", "scene_text": "2026元旦时，我们朋友聚在一起。大家捧着热乎乎的旺仔牛奶，说说笑笑。在温暖的气氛里，一起迎接新的一年的到来。", "drink_desc": "跨年的时候，和朋友一起喝旺仔牛奶，本来红红火火的特别有气氛。看着就喜欢，希望大家新年旺旺，寓意也很好。", "note": "跨年喝旺仔，寓意新的一年事事旺旺，好运连连。入口香甜顺滑，奶味浓郁，甜甜腻腻的生活都冲淡了。尤其热的喝是真的甜到心里，希望大家都能抛开所有烦恼，日子红火顺遂，万事兴旺。"}, "中产无娃-成都-D17": {"id": "中产无娃-成都-D17", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/自制饮品-3.png", "scene_text": "冬天我穿子不好服时，我父母就会给我煮梨汤来润喉喝", "drink_desc": "梨汤既能清瘦又能止咳，还能解除一身的寒气", "note": "父母的关爱融入饮品中，滋润孩子的身体和心灵"}, "中产无娃-成都-D18": {"id": "中产无娃-成都-D18", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/自制饮品-4.png", "scene_text": "每天下午工作疲劳时，来一杯热气腾腾的茶", "drink_desc": "茶能提神，又能提供人体所需的茶多酚", "note": "下午空闲时，能给同事和我解除工作上的压力"}, "中产无娃-成都-D19": {"id": "中产无娃-成都-D19", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/自制饮品-5.png", "scene_text": "当时周末天气很冷，朋友和我都想出去玩，", "drink_desc": "当时周末天气很冷，朋友和我都想出去玩，于是大家选择到三圣乡里面点一个围炉煮茶来聊天天", "note": "当时和朋友聊得特别开心，坐在草坪上也特别懒惰，感觉特别放松"}, "中产无娃-成都-D20": {"id": "中产无娃-成都-D20", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/自制饮品.png", "scene_text": "一般冬天的周末，我回去超市买买新鲜草莓和牛奶，自己制作草莓奶昔，然后给花添水，欣赏自己的花", "drink_desc": "自己打了热的牛奶草莓奶昔，草莓是超市买的，牛奶是菊乐的小瓶奶", "note": "加入新鲜草莓能增加多种维生素"}, "中产无娃-成都-D21": {"id": "中产无娃-成都-D21", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/街饮-1.png", "scene_text": "去年的冬天，我终于结束了准备许久的重要笔试。走出考场后，我来到龙湖天街，看着天上锦鲤缓缓游动，紧绷的心瞬间放松下来，非常轻松与喜欢。", "drink_desc": "书亦烧仙草1升装的超大桶让人满意，当时考完试天黑了，我也不想吃饭，就买的超有料的，抱着大桶吃（配个子），松地感觉幸福感拉满", "note": "基本半杯都是料，仙草冻滑滑的，配上Q弹珍珠、纳豆红豆、椰果，感觉能吃到花的子，喝起来超有劲。茶底有温润，多喝也不错，可以当晚饭了"}, "中产无娃-成都-D22": {"id": "中产无娃-成都-D22", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/街饮-2.png", "scene_text": "冬天开车的时候，需要一杯热咖啡来提神", "drink_desc": "咖啡既能提神，也满足我不爱吃早饭的能量需求", "note": "咖啡豆的提神效果让我在开车途中，注意力更加集中"}, "中产无娃-成都-D23": {"id": "中产无娃-成都-D23", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/街饮-3.png", "scene_text": "与朋友去上海迪士尼游玩，感觉园区里面人特别多，设施好玩，烟花特别好看。", "drink_desc": "当时在园区玩得又湿又累，想喝一杯热火又有能量的东西来消除饥饿", "note": "奶茶的珍珠喝起来特别香，上面的雪顶也很香浓，大杯奶茶让我满足"}, "中产无娃-成都-D24": {"id": "中产无娃-成都-D24", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/街饮-4.png", "scene_text": "在上班的时候", "drink_desc": "平时上班容易犯困。喝杯热黄油拿铁会好多", "note": "挺好的，温暖又提神"}, "中产无娃-成都-D25": {"id": "中产无娃-成都-D25", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/街饮-5.png", "scene_text": "在开车的时候", "drink_desc": "有时候出去玩开车路上也会犯困，来杯热黄油美式提神", "note": "虽然比提升，但还是有点苦"}, "中产无娃-成都-D26": {"id": "中产无娃-成都-D26", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/街饮-6.png", "scene_text": "在聚餐吃饭的时候", "drink_desc": "有时候在外面吃的很辣了，就喜欢点一杯喜欢茶的黑珍珠真牛奶解辣", "note": "没有缺点"}, "中产无娃-成都-D27": {"id": "中产无娃-成都-D27", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/街饮-7.png", "scene_text": "打游戏的时候", "drink_desc": "冬天打游戏本来手就冷，身上也冷，这个时候喜欢点杯霸王茶姬的伯牙绝弦", "note": "喝了容易精神睡不着"}, "中产无娃-成都-D28": {"id": "中产无娃-成都-D28", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/街饮-8.png", "scene_text": "在广州游玩时看到街边随处可见沙糖桩树，问了老板这边是他们之前的习俗", "drink_desc": "当时在广州街头散步，那天有点风，然后刚好路过一个茉莉奶白奶茶店，就买了一杯热饮", "note": "这个奶茶我点的不额外加糖，但是有些淡了，也几乎没有茶香，一般般吧。"}, "中产无娃-成都-D29": {"id": "中产无娃-成都-D29", "persona": "中产无娃", "city": "成都", "card_image": "原始数据/饮品卡/中产无娃-成都/街饮.png", "scene_text": "冬天吃火锅容易爆燃热肚胃，我会来一瓶热茶加牛奶来解腻，算是自制养莉奶绿，解腻又降火。", "drink_desc": "在便利店直接买热的东方树叶茉莉花茶，喝掉一半再倒入热牛奶。完美高配版茉莉奶绿～", "note": "东方树叶茉莉花茶是0糖的，茉莉香味很自然，适合配糖的，再加上新鲜热牛奶，口感混合香气清爽，很适合解腻，比外面更好的茶饮健康多，受爱的高配版茉莉奶绿。"}, "中产有娃-上海-D01": {"id": "中产有娃-上海-D01", "persona": "中产有娃", "city": "上海", "card_image": "原始数据/饮品卡/中产有娃-上海/瓶装饮品-1.png", "scene_text": "带小朋友去玩了环球影城，天气冷了，下朋友玩了一天很累，特地给她买了魔法杯，拿上暖暖和她...", "drink_desc": "玩了一天又累又困，孩子可以睡了，我还要保证他们的安全，所以喝热咖啡能缓解疲劳，提神", "note": "欢迎激情分享"}, "中产有娃-上海-D02": {"id": "中产有娃-上海-D02", "persona": "中产有娃", "city": "上海", "card_image": "原始数据/饮品卡/中产有娃-上海/瓶装饮品-2.png", "scene_text": "冬天早上起床上班时因为我的，凑其在马路上走，早上又没睡醒，路上寒风吹着，穿再多衣服也没用...", "drink_desc": "冬天的早餐，人总觉得很累，很困，打不起精神没有活力，这个饮料是健康饮料，可以活跃温调整体状态", "note": "欢迎激情分享"}, "中产有娃-上海-D03": {"id": "中产有娃-上海-D03", "persona": "中产有娃", "city": "上海", "card_image": "原始数据/饮品卡/中产有娃-上海/瓶装饮品-3.png", "scene_text": "年底和朋友跨年电音节，辞旧迎新，比起放松，比起开心。", "drink_desc": "热的果汁可以增加气氛，甜甜的口感可以让心情更愉悦，大冷天一直站在场馆里，也能够给身体热量", "note": "欢迎积极分享"}, "中产有娃-上海-D04": {"id": "中产有娃-上海-D04", "persona": "中产有娃", "city": "上海", "card_image": "原始数据/饮品卡/中产有娃-上海/瓶装饮品-4.png", "scene_text": "冬天过年期间，全家人的团聚，一顿火锅是必不可少，不仅能放松气氛，还有很方便随性，增加了亲密感...", "drink_desc": "热的牛奶，不仅可以解辣，还可以减少火锅对胃肠道的刺激，比比较健康。", "note": "欢迎激情分享"}, "中产有娃-上海-D05": {"id": "中产有娃-上海-D05", "persona": "中产有娃", "city": "上海", "card_image": "原始数据/饮品卡/中产有娃-上海/瓶装饮品.png", "scene_text": "冬天的时候在北京和零下十度左右带着小朋友爬长城，虽然零下10度，但是天气很好，风景很好", "drink_desc": "能给自己温暖的同时，还能解渴，缓解口感补充体力。", "note": "欢迎积极分享"}, "中产有娃-上海-D06": {"id": "中产有娃-上海-D06", "persona": "中产有娃", "city": "上海", "card_image": "原始数据/饮品卡/中产有娃-上海/自制饮品-1.png", "scene_text": "晚上要加班做项目时，做了很久头香脑涨，又很困，这个时候会给自己冲一杯热咖啡，提神醒脑，提...", "drink_desc": "有时候直接冲，有时候会加一些牛奶。", "note": "口味比较好"}, "中产有娃-上海-D07": {"id": "中产有娃-上海-D07", "persona": "中产有娃", "city": "上海", "card_image": "原始数据/饮品卡/中产有娃-上海/自制饮品-2.png", "scene_text": "天冷吹到冷风时，回家后觉得头疼，可能会感冒，有感冒的前兆。", "drink_desc": "自己用热水泡，能够驱寒，让身体暖起来，最大程度的预防感冒。", "note": ""}, "中产有娃-上海-D08": {"id": "中产有娃-上海-D08", "persona": "中产有娃", "city": "上海", "card_image": "原始数据/饮品卡/中产有娃-上海/自制饮品.png", "scene_text": "在家看电视会比较无聊，越坐越冷，会冲一杯热巧克力", "drink_desc": "自己在家里拿水杯冲，自已调整浓度，一条杯。", "note": "口味比较好"}, "中产有娃-上海-D09": {"id": "中产有娃-上海-D09", "persona": "中产有娃", "city": "上海", "card_image": "原始数据/饮品卡/中产有娃-上海/购买-1.png", "scene_text": "逛街时间长了，累了无聊了，会去买一杯热饮，缓解疲劳。", "drink_desc": "会去霸王茶妃去买一杯热的伯牙绝弦。", "note": ""}, "中产有娃-上海-D10": {"id": "中产有娃-上海-D10", "persona": "中产有娃", "city": "上海", "card_image": "原始数据/饮品卡/中产有娃-上海/购买.png", "scene_text": "冬天在马路上等公交车，又冷又无聊。啧，一杯热饮可以让自己暖一点", "drink_desc": "直接去超市的热饮柜上拿一瓶。", "note": ""}, "中产有娃-哈尔滨-D01": {"id": "中产有娃-哈尔滨-D01", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/其他-1.png", "scene_text": "工作的时候看到阳光洒下来，感觉今天气氛很好，心里也暖感觉冬天也不冷了。", "drink_desc": "加班到很晚的时候很困就会选择咖啡喝一下", "note": "很管用的很提神呢"}, "中产有娃-哈尔滨-D02": {"id": "中产有娃-哈尔滨-D02", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/其他-2.png", "scene_text": "哈尔滨冬天的夜景", "drink_desc": "咖啡，边着夜景喝着暖和的咖啡真是太享受了", "note": "雀巢的咖啡真是太好喝了，口碑是排在第一的"}, "中产有娃-哈尔滨-D03": {"id": "中产有娃-哈尔滨-D03", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/其他-3.png", "scene_text": "收到最暖心的事情是收到来自朋友送的香水", "drink_desc": "喝了柚子茶甜甜的很解腻，过节日收到了礼物，喝点甜甜的心情好", "note": "吃油腻的东西可以喝柚子茶，很美味"}, "中产有娃-哈尔滨-D04": {"id": "中产有娃-哈尔滨-D04", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/其他.png", "scene_text": "公司也会准备热饮，人事还是很有生活的，懂得大家的需要", "drink_desc": "一般喝矿泉水热的", "note": "这个饮品大小小包装都有很方便"}, "中产有娃-哈尔滨-D05": {"id": "中产有娃-哈尔滨-D05", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/瓶装饮品-1.png", "scene_text": "家庭团聚的时候喜欢欢笑。很开心一年的疲惫都没了。", "drink_desc": "喝的是三得利的乌龙茶，这个茶是无糖的老人小孩都适合进消化，大包装家庭喝合适", "note": "这款茶其实减肥也很适合，促进排泄"}, "中产有娃-哈尔滨-D06": {"id": "中产有娃-哈尔滨-D06", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/瓶装饮品-2.png", "scene_text": "和老婆来看了汪苏泷的十万伏特演唱会，很开心很激动，就是太冷了。", "drink_desc": "够买方便。可以暖手，拿着也方便很多。", "note": "味道很好不错"}, "中产有娃-哈尔滨-D07": {"id": "中产有娃-哈尔滨-D07", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/瓶装饮品-3.png", "scene_text": "没有什么事情是火锅解决不了的，很美味", "drink_desc": "火锅配着奶茶，真是美味搭子", "note": "这款奶茶无糖很好，不腻"}, "中产有娃-哈尔滨-D08": {"id": "中产有娃-哈尔滨-D08", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/瓶装饮品-4.png", "scene_text": "哈尔滨的深夜，很美，伴着雪映出东方小巴黎的美丽", "drink_desc": "因为咖啡加热，会很好喝，口感更细腻", "note": "跟家人一起喝咖啡，也可以不用去咖啡厅了，也能实现小聚，随时随地的都可以喝"}, "中产有娃-哈尔滨-D09": {"id": "中产有娃-哈尔滨-D09", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/瓶装饮品-5.png", "scene_text": "最冷的一天是我们东北下雪，三九天，呼呼冷，冰雪大世界也建成", "drink_desc": "我喜欢喝热的茶饮，喝茶很养生", "note": "喜欢喝茶，喝茶很养生"}, "中产有娃-哈尔滨-D10": {"id": "中产有娃-哈尔滨-D10", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/瓶装饮品.png", "scene_text": "工作的时候会想和一些带点味道的饮品，还不想让身体有负担", "drink_desc": "看着很健康很纯天然", "note": "瓶养生的梨子很好喝"}, "中产有娃-哈尔滨-D11": {"id": "中产有娃-哈尔滨-D11", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/自制饮品-1.png", "scene_text": "孩子学会了写毛笔字，过年写了福字，老人家人都很开心，他也长大了。", "drink_desc": "微波炉热奶快捷高效，自制一般都是在家用微波炉做，老婆不舒服的时候可以喝，孩子饿了也...", "note": "生理期必须给老婆做的一个饮品，喝了舒服，老婆心情也好"}, "中产有娃-哈尔滨-D12": {"id": "中产有娃-哈尔滨-D12", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/自制饮品-2.png", "scene_text": "来一碗麻辣烫很好吃", "drink_desc": "吃碗麻辣烫喝着柚子茶，很解腻", "note": "这款柚子茶不是特别甜，搭配麻辣烫是太解腻了"}, "中产有娃-哈尔滨-D13": {"id": "中产有娃-哈尔滨-D13", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/自制饮品-3.png", "scene_text": "是过生日吃蛋糕，很开心，吃甜品可以让我快乐", "drink_desc": "晚上过生日的时候来瓶咖啡，很提神", "note": "喝咖啡，加班熬夜都可以喝，提神"}, "中产有娃-哈尔滨-D14": {"id": "中产有娃-哈尔滨-D14", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/自制饮品.png", "scene_text": "在家也要放松一下准备一些小茶饮给自己犒劳", "drink_desc": "自己泡的: 原味茶", "note": "茶可以招待任何人方便"}, "中产有娃-哈尔滨-D15": {"id": "中产有娃-哈尔滨-D15", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/街饮-1.png", "scene_text": "去看了网上很火的大雪人，和大雪人合照，孩子非常开心。", "drink_desc": "孩子在外面玩雪，冷了一定要喝奶茶暖一暖，就在街边买了一杯。", "note": "这就是小孩子爱喝的饮品，大人喝身体代谢负担挺大的。"}, "中产有娃-哈尔滨-D16": {"id": "中产有娃-哈尔滨-D16", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/街饮-2.png", "scene_text": "冰雪大世界的景色", "drink_desc": "b来到了景区拿出一瓶热饮咖啡很惬意", "note": "这款咖啡很丝滑"}, "中产有娃-哈尔滨-D17": {"id": "中产有娃-哈尔滨-D17", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/街饮-3.png", "scene_text": "纪念日是结婚纪念日，必须有仪式感", "drink_desc": "喝茶很暖胃，也很养生，而且不长肉", "note": "喜欢喝茶，喝茶不长肉"}, "中产有娃-哈尔滨-D18": {"id": "中产有娃-哈尔滨-D18", "persona": "中产有娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产有娃-哈尔滨/街饮.png", "scene_text": "上班的路上，或者是路过早餐车都会买一杯", "drink_desc": "健康养生，可以和牛奶换着喝要不喝的该贪了。", "note": "有条件可以自己做一下"}, "中产有娃-广州-D01": {"id": "中产有娃-广州-D01", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/其他.png", "scene_text": "每天上班在茶水间摸鱼", "drink_desc": "请优先选择您自己拍摄的照片，如果为自制饮品，请选择外包装", "note": "平淡无味"}, "中产有娃-广州-D02": {"id": "中产有娃-广州-D02", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/瓶装饮品-1.png", "scene_text": "远途特种兵必需品", "drink_desc": "远程带娃需要提神，为方便带的咖啡；或者热好带上班也很经济实惠", "note": "当我需要外出户外活动比较频繁的时候，我会选择瓶装非一次性热饮不易携带，价格经济..."}, "中产有娃-广州-D03": {"id": "中产有娃-广州-D03", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/瓶装饮品-2.png", "scene_text": "女儿和她的小伙伴在罗马公园骑单车，又是特别种兵的一天", "drink_desc": "是和朋友外出野餐的日子，因为要特种兵一天，所以早早在便利店买了瓶热的星巴克提神", "note": "当我需要外出户外活动比较久的时候，我会选择瓶装而非一次性热饮不易携带，价格经济..."}, "中产有娃-广州-D04": {"id": "中产有娃-广州-D04", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/瓶装饮品-3.png", "scene_text": "病倒啦，女儿在医院吊针，拍片，她没哭很坚强，老母亲我更心疼了...", "drink_desc": "当我需要很专注、学习、加班的时候会选择三得利的乌龙茶，那晚在医院我狂喝了两瓶", "note": "是我很喜欢的一款乌龙茶，饮茶饮已经成了我的习惯之一，是我的续命茶"}, "中产有娃-广州-D05": {"id": "中产有娃-广州-D05", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/瓶装饮品-4.png", "scene_text": "外出的时候想喝点茶，但是又不想喝冷的，喝农夫山泉的热茶就行了", "drink_desc": "瓶装热饮方便携带，又不腻很解渴。", "note": "方便携带，味道清淡，适合日常饮用。"}, "中产有娃-广州-D06": {"id": "中产有娃-广州-D06", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/瓶装饮品-5.png", "scene_text": "年初一，带孩子到海珠湖游玩，花开得极盛，极美。", "drink_desc": "和小孩一起去公园，这个维他奶方便买到，又暖又健康。", "note": "非常满足小孩子喝想喝饮料的愿望。"}, "中产有娃-广州-D07": {"id": "中产有娃-广州-D07", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/瓶装饮品-6.png", "scene_text": "那天降温了，一群人去赏花，化石岭森林公园赏花，天气很冷但是很开心。", "drink_desc": "喝上很累，喝点热茶提神暖身。", "note": "在寒冷的户外活动上喝上一口热茶真的很满足。"}, "中产有娃-广州-D08": {"id": "中产有娃-广州-D08", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/瓶装饮品-7.png", "scene_text": "周末在家看剧", "drink_desc": "维他最经典的巧克力豆奶", "note": "和家人分享喜欢的巧克力豆奶"}, "中产有娃-广州-D09": {"id": "中产有娃-广州-D09", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/瓶装饮品-8.png", "scene_text": "陪着老婆孩子在热闹的花市，看满街红灯笼的年花，手里捧着刚买的年桔和鲜花。耳边是熟悉的...", "drink_desc": "冬天想喝点热的，随手拿了这个维他港式奶茶，加热一下还挺方便的，味道也不错。", "note": "整体味道还可以，就是希望能出个低糖版就更好了。"}, "中产有娃-广州-D10": {"id": "中产有娃-广州-D10", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/瓶装饮品.png", "scene_text": "工作工作和工作", "drink_desc": "三得利的乌龙茶是家中常备，冬天会用恒温杯加热", "note": "是我很喜欢的一款乌龙茶，喝茶饮已经成了我的习惯之一，是我的生命茶"}, "中产有娃-广州-D11": {"id": "中产有娃-广州-D11", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/盒装饮料.png", "scene_text": "记得第一次清晨6点多出门上班，天还不是很亮，拍下了树叶围起来的一个粉色心形~", "drink_desc": "那天天气很冷，很多饮品店没有开门，走进了711小暖柜买了一盒热的维他豆奶", "note": "在上班路上很赶时间，我会经常到711买可以立刻结账的热饮，方便又暖胃，维他豆奶是我一直复购的，没有负担又好喝"}, "中产有娃-广州-D12": {"id": "中产有娃-广州-D12", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/自制饮品-1.png", "scene_text": "看了一场热血沸腾的摇滚乐队livehouse演出，瞬间充满活力。", "drink_desc": "罗汉果和菊花一起煮再用一次性瓶子装起来带走，看演出会跟唱，喝点茶滋润。", "note": "润喉又健康，不刺激。"}, "中产有娃-广州-D13": {"id": "中产有娃-广州-D13", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/自制饮品-2.png", "scene_text": "每天都在办公室当牛马", "drink_desc": "每天都自己泡茶喝", "note": "正常口味茶"}, "中产有娃-广州-D14": {"id": "中产有娃-广州-D14", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/自制饮品-3.png", "scene_text": "裹着同一条毯子，坐在沙发上看一部暖平子的电影，手边着热茶。不用刻意说什么，安静的陪伴就是足够治愈整个冬天的疲惫。", "drink_desc": "每天都自己泡茶喝", "note": "正常口味糖茶"}, "中产有娃-广州-D15": {"id": "中产有娃-广州-D15", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/自制饮品.png", "scene_text": "火锅煮肉吃多了，喉咙痛，喝子痛，喝点花果海底椰雪梨水，好喝又不腻。", "drink_desc": "煮点无花果海底椰雪梨水，降火又滋润，非常健康。", "note": "这种自制的饮料没有防腐剂和添加剂，很适合小孩子和老人饮用。"}, "中产有娃-广州-D16": {"id": "中产有娃-广州-D16", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/街饮-1.png", "scene_text": "每个月总有那么几天", "drink_desc": "每个月经期必点+起码点一杯手热糖姜茶", "note": "姨妈推荐给会痛经的姐妹们，姜茶可以选辣度，备注意要卫生哦， 请姨妈热饮永远不倒闭"}, "中产有娃-广州-D17": {"id": "中产有娃-广州-D17", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/街饮-2.png", "scene_text": "圣诞节和两家家庭在卡朋西餐厅庆祝，殊不知大家都神秘准备了蛋糕，所以那天我们吃了三个圣诞...", "drink_desc": "去卡朋基本必点他们家的珍珠奶茶，夏天喝冷的冬天就喝热的，珍珠很好喝", "note": "珍珠YYDS，我永远爱她，我要在温暖天下的珍珠"}, "中产有娃-广州-D18": {"id": "中产有娃-广州-D18", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/街饮-3.png", "scene_text": "年三十，和孩子一起装饰年桔，给家里增添春节气氛", "drink_desc": "新春manner的杯子有特别的logo，点了杯热香榧拿铁，和女儿给家里添加春节装饰", "note": "咖啡比较喜欢喝manner的，热香榧拿铁是我的最爱，热饮会比冷饮好喝，口感更顺滑、稠厚。"}, "中产有娃-广州-D19": {"id": "中产有娃-广州-D19", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/街饮-4.png", "scene_text": "冬天和朋友逛街的时候想喝饮料，就买一杯珍珠奶茶；边走边喝。", "drink_desc": "喜欢茶热奶茶搭配红糖珍珠，既有饱腹感又能喝上奶茶", "note": "适合年轻人的饮料"}, "中产有娃-广州-D20": {"id": "中产有娃-广州-D20", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/街饮-5.png", "scene_text": "公司经营的最后一天，和其多年的同事告别，从此就失去了，心里难过。", "drink_desc": "热咖啡提神醒脑，给打工人提供能量。", "note": "非常适合打工人饮用。"}, "中产有娃-广州-D21": {"id": "中产有娃-广州-D21", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/街饮-6.png", "scene_text": "临近春节，和好友去澳门血拼年货，开心。", "drink_desc": "澳门驰名世记咖啡，逛得又累，来杯热咖啡充充电。", "note": "充满地域特色的饮品，非常值得购买。"}, "中产有娃-广州-D22": {"id": "中产有娃-广州-D22", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/街饮-7.png", "scene_text": "每天都在办公室当牛马", "drink_desc": "下午很困，正好点杯霸茶王奶茶提神", "note": "很好喝的味道"}, "中产有娃-广州-D23": {"id": "中产有娃-广州-D23", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/街饮-8.png", "scene_text": "一家人围在热气腾腾的锅边，看着食材在清汤里翻滚，聊着日常的琐事。锅里的暖香裹着烟火气，是...", "drink_desc": "吃火锅配杯豆奶，刚好解腻，也暖暖身子。", "note": "经典的味道，一直很好喝"}, "中产有娃-广州-D24": {"id": "中产有娃-广州-D24", "persona": "中产有娃", "city": "广州", "card_image": "原始数据/饮品卡/中产有娃-广州/街饮.png", "scene_text": "因为工作需要经常见客户，喝点东西是必不可少的啦", "drink_desc": "她是常驻嘉宾", "note": "咖啡比较喜欢manner的，热香拿铁是我的最爱，热款会比冷饮好喝，口感更顺滑、醇厚"}, "中产有娃-成都-D01": {"id": "中产有娃-成都-D01", "persona": "中产有娃", "city": "成都", "card_image": "原始数据/饮品卡/中产有娃-成都/其他-1.png", "scene_text": "去爬了一次野山", "drink_desc": "喝点甜的更容易补充能量", "note": "需要爬山的时候补充一点能量"}, "中产有娃-成都-D02": {"id": "中产有娃-成都-D02", "persona": "中产有娃", "city": "成都", "card_image": "原始数据/饮品卡/中产有娃-成都/其他-2.png", "scene_text": "有时闲逛", "drink_desc": "闭翘偌尔喝点咖啡", "note": "咖啡不会太浓郁，喝了也不影响睡觉"}, "中产有娃-成都-D03": {"id": "中产有娃-成都-D03", "persona": "中产有娃", "city": "成都", "card_image": "原始数据/饮品卡/中产有娃-成都/其他-3.png", "scene_text": "和朋友一起闲逛，感觉时光慢慢的过得很幸福", "drink_desc": "逛街随便喝一些奶茶", "note": "奶味比较浓郁，薄荷味道比较好，很喜欢"}, "中产有娃-成都-D04": {"id": "中产有娃-成都-D04", "persona": "中产有娃", "city": "成都", "card_image": "原始数据/饮品卡/中产有娃-成都/其他.png", "scene_text": "周末户外钓鱼", "drink_desc": "喝起了什么？很解渴", "note": "喝起不是很甜，但是很暖心"}, "中产有娃-成都-D05": {"id": "中产有娃-成都-D05", "persona": "中产有娃", "city": "成都", "card_image": "原始数据/饮品卡/中产有娃-成都/瓶装饮品-1.png", "scene_text": "日常聚餐和家人", "drink_desc": "柚子茶比较解腻，冬天也比较暖胃", "note": "和家人一起分享甜蜜时刻"}, "中产有娃-成都-D06": {"id": "中产有娃-成都-D06", "persona": "中产有娃", "city": "成都", "card_image": "原始数据/饮品卡/中产有娃-成都/瓶装饮品-10.png", "scene_text": "极具降温，非常的冷", "drink_desc": "下午的冬天喝一点下午茶感觉挺棒的", "note": "就喜欢在冬天的下午喝点下午茶，既不会长胖也不会分脏"}, "中产有娃-成都-D07": {"id": "中产有娃-成都-D07", "persona": "中产有娃", "city": "成都", "card_image": "原始数 ene_text": "工作日晚上，我会和同学一起去吃晚餐，边看球赛边吃炸鸡", "drink_desc": "吃炸鸡的时候，会觉得很腻，这个时候就想喝碳酸饮料，解腻。", "note": "美年达的橙子味道和气泡感特别足，喝起来特别的爽"}, "学生-上海-D06": {"id": "学生-上海-D06", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-14.png", "scene_text": "工作日午餐 买了维他柠檬茶随餐", "drink_desc": "维他柠檬茶，搭配一些风味较重口的食物很合适，可以解腻", "note": "出了低糖版的，喝了还能补充vc，下次打算买看看"}, "学生-上海-D07": {"id": "学生-上海-D07", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-15.png", "scene_text": "聚餐 和朋友吃火锅一起搭配了饮料！", "drink_desc": "椰子水，因为火锅有点辣，有点油腻，想喝点有味道的但是清爽解腻的饮料", "note": "冰镇的更好喝，椰子味更浓"}, "学生-上海-D08": {"id": "学生-上海-D08", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-16.png", "scene_text": "汉休日中午，想吃披萨了，买了达美乐的披萨，配了茉莉花茶", "drink_desc": "这茶喝起来特别清爽，就是纯纯的茉莉花香和淡淡的茶香", "note": "这款无糖茶还是0糖0脂的，特别健康..."}, "学生-上海-D09": {"id": "学生-上海-D09", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-17.png", "scene_text": "天气好的时候户外野餐", "drink_desc": "入口泡沫较多，气泡多，较为刺激，可能是减糖原因，非常清爽", "note": "口味比较多，都是低糖的，随便选择都不错"}, "学生-上海-D10": {"id": "学生-上海-D10", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-18.png", "scene_text": "上学路上在便利店看到的，放在便利店暖柜里，买上这样一杯还可以暖手。", "drink_desc": "三得利蜜香暖柚，很适合冬天的一杯，喝上去感觉嘴子被滋润了！柚子和梨子的味道都很突出，略甜", "note": "口味很多，就是感觉稍微有点甜了"}, "学生-上海-D11": {"id": "学生-上海-D11", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-19.png", "scene_text": "和朋友们聚会吃火锅 增进感情", "drink_desc": "我喝的是东方树叶茉莉花茶，这款茶饮店家有热的保温的，而且c喝下去解腻且0卡糖，很适合我...", "note": "这款茶饮给我感觉很健康"}, "学生-上海-D12": {"id": "学生-上海-D12", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-2.png", "scene_text": "上课打起精神", "drink_desc": "醇厚乌龙茶香润不腻，热饮暖身解腻，冬日喝着清爽又舒服", "note": "吃早饭的时候来一杯，既可以抑制食欲，又可以提神醒脑"}, "学生-上海-D13": {"id": "学生-上海-D13", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-20.png", "scene_text": "准备往图书馆走去，去看书复习", "drink_desc": "很好喝的热橙茶，而且就在图书馆楼下的自动售货机有售，购买方便", "note": "欢迎积极分享"}, "学生-上海-D14": {"id": "学生-上海-D14", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-21.png", "scene_text": "和家人自驾出去玩，在路途中，车里", "drink_desc": "用东方树叶茉莉花茶和光明纯牛奶混合制成的茉莉奶绿，是跟着小红书学的", "note": "欢迎激情分享"}, "学生-上海-D15": {"id": "学生-上海-D15", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-22.png", "scene_text": "准备搭乘地铁前往市区", "drink_desc": "红豆意米", "note": "欢迎积极分享"}, "学生-上海-D16": {"id": "学生-上海-D16", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-23.png", "scene_text": "和朋友一起在餐厅吃午餐", "drink_desc": "这款饮品很适合午餐的时候搭配食物，味道好喝，还是热饮（冬季）", "note": "欢迎积极分享"}, "学生-上海-D17": {"id": "学生-上海-D17", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-24.png", "scene_text": "冬天在学校上课时，不想喝冰饮也不想喝没味道的白水，就会带一瓶热的红豆薏米水（便宜店里面有...", "drink_desc": "喝了好望水的红豆薏米水，既能当小甜水解渴，又能暖身，喝着也没那么负担。", "note": "喝起来没负担，但是又暖胃健康。"}, "学生-上海-D18": {"id": "学生-上海-D18", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-25.png", "scene_text": "火锅店里跟朋友吃火锅，店里会送来好喝的清淡梅汤", "drink_desc": "康师傅酸梅汤，在火锅店吃辣锅，冰喝了肚里会不舒服，就会点一瓶热的酸梅汤（有时店里会送）", "note": "很解腻，但是因为被加热了，所以喝着也很舒服"}, "学生-上海-D19": {"id": "学生-上海-D19", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-26.png", "scene_text": "下课换教室的时候，风很大，就喝热奶茶，而且撑在手里", "drink_desc": "喜欢茶的黑糖波波牛奶茶，既能暖手，喝下去也能快速暖到肚里，而且珍珠之类的东西，跟冬天很搭", "note": "味道很好有层次，很多种味道"}, "学生-上海-D20": {"id": "学生-上海-D20", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-27.png", "scene_text": "宿舍追剧，或者有时候生理期，不想喝冰的也不想喝白开水，在宿舍追剧消磨时光", "drink_desc": "会喝瑞幸的热可可，或者一点点的阿华田，抱着杯子边喝边看剧，暖乎乎的很放松，而且胃也暖和多了", "note": "这个可可饮料我一般会点无糖的"}, "学生-上海-D21": {"id": "学生-上海-D21", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-28.png", "scene_text": "傍晚散步或者健身完后会出点汗，不想喝冰的刺激喉咙，但又想补充能量", "drink_desc": "请优先选择饮品的图片，如果是自拍的，可以使用网图", "note": "基本没有热的，但是如果有，我冬天愿意喝"}, "学生-上海-D22": {"id": "学生-上海-D22", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-29.png", "scene_text": "冬天来生理期，在宿舍里窝着，会喝红豆薏米水帮助缓解", "drink_desc": "红豆薏米水，", "note": "冬天窝在宿舍被子里，缓解生理期疼痛感觉非常治愈，幸福感拉满"}, "学生-上海-D23": {"id": "学生-上海-D23", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-3.png", "scene_text": "乘坐交通中", "drink_desc": "提神 还有一点饱腹感", "note": "少见不错的瓶装咖啡"}, "学生-上海-D24": {"id": "学生-上海-D24", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-30.png", "scene_text": "冬天在教室上课，非常冷，有时候会感冒", "drink_desc": "乌龙茶，温温的茶水喝下去润润的，没有负担。", "note": "乌龙茶暖到肚里，冬天感冒时，连鼻子都好像通了一点，算是给自己的..."}, "学生-上海-D25": {"id": "学生-上海-D25", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-31.png", "scene_text": "早八进课路上", "drink_desc": "冬天的早上起不来，早上喝Costa咖啡提神", "note": "冷风刮得手冷的时候，喝一口咖啡都被冲散了不少。"}, "学生-上海-D26": {"id": "学生-上海-D26", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-32.png", "scene_text": "期末周在图书馆复习，与同学在一起，", "drink_desc": "阿华田燕麦可可，在便利店买了阿华田燕麦可可。", "note": "写题写到脑子发懵的时候，喝一口甜丝丝的热可可，暖平时的顺着喉咙下去，整个人都放松下来，搞过了最后几页的复..."}, "学生-上海-D27": {"id": "学生-上海-D27", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-33.png", "scene_text": "周末窝在沙发里追剧，外面下着冷雨不想出门，", "drink_desc": "阿萨姆奶茶，裹着毯子x追剧，一口下去是暖平平的茶香奶味，感觉非常放松", "note": "慢慢悠闲一下下午，整个人都松弛下来，特别舒服。"}, "学生-上海-D28": {"id": "学生-上海-D28", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-4.png", "scene_text": "开水煮的牛奶 自己准备 或者便利店", "drink_desc": "牛奶当做早餐", "note": "这个牛奶质量一般"}, "学生-上海-D29": {"id": "学生-上海-D29", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-5.png", "scene_text": "上课前 从食堂堂桶 顺路买暖的矿泉水", "drink_desc": "矿泉水 农夫山泉 口感还可以 吃药方便", "note": "矿泉水 早上吃药 图个方便"}, "学生-上海-D30": {"id": "学生-上海-D30", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-6.png", "scene_text": "白天上完一天的课程，晚上回到宿舍玩游戏休息时，会买AD钙奶喝", "drink_desc": "AD钙奶酸甜好喝，口感顺滑，喝着很过瘾。既能补营养，又是小时候的味道，很怀念。", "note": "AD钙奶酸甜顺口，解渴又好喝，日常喝很合适。奶香浓郁还带着清爽，不管配饭还是单喝都很棒。"}, "学生-上海-D31": {"id": "学生-上海-D31", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-7.png", "scene_text": "上课或者休息的时候经常会到学校里的超市，便利店买这个枸杞茶喝。", "drink_desc": "平时喝枸杞茶，能温润养生，舒缓身体。口感清甜不腻，很适合日常补水饮用。", "note": "这款红枸杞水，喝起来是淡淡的红枣清甜，带着枸杞的温润香气，口感清爽不腻，0糖配方喝着没负担。"}, "学生-上海-D32": {"id": "学生-上海-D32", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-8.png", "scene_text": "普通节假日，和同学一起到外面吃饭，买了王老吉降火。", "drink_desc": "因为桌上的菜吃的容易上火，王老吉口感清爽，可以降火，让用餐体验更舒适。", "note": "王老吉口感清爽，很适合搭配饭菜一起喝。日常餐常备，解渴又解腻，喝着很舒服。"}, "学生-上海-D33": {"id": "学生-上海-D33", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品-9.png", "scene_text": "放假到外面玩，去喝了老北京豆汁和奶皮子酸奶。", "drink_desc": "因为这个奶皮子酸奶奶香浓郁，奶皮厚实，我特别喜欢，经常买。", "note": "茉莉味的也比较好喝，挺推荐的。"}, "学生-上海-D34": {"id": "学生-上海-D34", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/瓶装饮品.png", "scene_text": "在图书馆学习", "drink_desc": "在街边便利店，不用排队就可以买到。寒风里喝一口暖饮，甜香暖胃了整颗心", "note": "冬天超好喝，还有性价比比很多便利店都高"}, "学生-上海-D35": {"id": "学生-上海-D35", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/自制饮品.png", "scene_text": "请将场景的图片、描述、场景类型复制到下方", "drink_desc": "不想喝白开水时不错的选择", "note": "可以当水喝"}, "学生-上海-D36": {"id": "学生-上海-D36", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/街饮-1.png", "scene_text": "街边闲逛", "drink_desc": "喜欢三倍厚抹茶奶盖麻薯加抹茶冻，三重叠加，越喝越浓", "note": "最多三倍不要再抹茶了，不然太苦"}, "学生-上海-D37": {"id": "学生-上海-D37", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/街饮-2.png", "scene_text": "", "drink_desc": "好吃好喝无需多言", "note": "这个真的好吃"}, "学生-上海-D38": {"id": "学生-上海-D38", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/街饮-3.png", "scene_text": "节假日和舍友一起出去逛街玩，买了瑞幸咖啡，边喝边逛。", "drink_desc": "逛街时来杯瑞幸，提神又解乏走路都更有精神。咖啡口感香醇，搭配逛街休闲，气氛感刚刚好。", "note": "瑞幸咖啡口感顺滑浓郁，提神效果很不错。口味选择多，逛街喝一杯，轻松又惬意。"}, "学生-上海-D39": {"id": "学生-上海-D39", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/街饮-4.png", "scene_text": "下午休息的时候，我会自己去咖啡店买杯咖啡，听听音乐放松下，享受自己的时光", "drink_desc": "喝一杯冰美式，清爽又有咖啡的苦香", "note": "冰美式口感清爽，提神效果很好，喝起来有着咖啡的香气，很适合自己休闲的时候来上一杯。"}, "学生-上海-D40": {"id": "学生-上海-D40", "persona": "学生", "city": "上海", "card_image": "原始数据/饮品卡/学生-上海/街饮-5.png", "scene_text": "早晨懒惰的时候配上一杯美式，提神醒脑", "drink_desc": "用美式开启一天，不仅能提神脑还能减肥", "note": "瑞幸的美式性价比很高，9.9一杯喝起来咖啡豆品质也不错"}, "学生-上海-D41": {"id": "学生-上海-D41", "persona": "学生", "city": "上海", " /学生-广州/瓶装饮品-14.png", "scene_text": "工作日是我在便利店吃早餐的场景", "drink_desc": "鲜牛奶，因为冬天吃早餐希望早点上可以喝点热的暖暖肚", "note": "早上来一杯热牛奶真的暖肚，而且也非常好喝这个鲜牛奶。"}, "学生-广州-D10": {"id": "学生-广州-D10", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/瓶装饮品-15.png", "scene_text": "等待地铁中", "drink_desc": "刚买热的立顿奶茶，好喝暖胃", "note": "这款奶茶特别好喝，不算特别甜，但很有茶味，强推"}, "学生-广州-D11": {"id": "学生-广州-D11", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/瓶装饮品-2.png", "scene_text": "冬天的早八课，在便利店买早餐到教室吃。", "drink_desc": "维他奶，边走边喝，抵御清晨的寒风。", "note": "最好喝的就是巧克力味，特别抢手几乎抢不到别人。"}, "学生-广州-D12": {"id": "学生-广州-D12", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/瓶装饮品-3.png", "scene_text": "和朋友一起去吃饭时共，购买的一款饮料", "drink_desc": "阿萨姆", "note": "童年回忆成分全口感丝滑，便携方便"}, "学生-广州-D13": {"id": "学生-广州-D13", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/瓶装饮品-4.png", "scene_text": "在冬天好困的时候去便利店柜里买一瓶热咖啡", "drink_desc": "星巴克咖啡", "note": "便利店随身抓的快乐，这一瓶星巴克咖啡太对味了"}, "学生-广州-D14": {"id": "学生-广州-D14", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/瓶装饮品-5.png", "scene_text": "高中的一个周末和朋友一起聚餐，随便找了家餐馆", "drink_desc": "三得利的茶给人一种平静的感觉，入口清淡不腻（无糖）", "note": "适合口干或者心烦的时候，个人觉得无糖的更好喝"}, "学生-广州-D15": {"id": "学生-广州-D15", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/瓶装饮品-6.png", "scene_text": "高中上学时的一个下午，非常漂亮", "drink_desc": "校园小卖部卖的热的乌龙茶", "note": "清淡微涩的口感，适合上课的时间喝"}, "学生-广州-D16": {"id": "学生-广州-D16", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/瓶装饮品-7.png", "scene_text": "和女朋友出去吃的漂亮饭，还记得这个时候是去去年跨年呢哈哈", "drink_desc": "从初中就一直喜欢喝的巧克力味维他奶，后面发现热的更好喝！", "note": "一次只能喝一瓶，不然会腻！"}, "学生-广州-D17": {"id": "学生-广州-D17", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/瓶装饮品-8.png", "scene_text": "锤炼完吃的香蕉和热牛奶，非常 nice", "drink_desc": "因为在减肥，所以选择喝低脂高钙的，非常健康", "note": "十分推荐这个奶，非常健康"}, "学生-广州-D18": {"id": "学生-广州-D18", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/瓶装饮品-9.png", "scene_text": "过年聚餐，和朋友们一起吃大排档炒菜。", "drink_desc": "热咖啡", "note": "咖啡要加糖，不然太苦了喝不下"}, "学生-广州- /饮品卡/学生-广州/街饮-12.png", "scene_text": "周末自己去吃黑手面", "drink_desc": "店里有特惠，买了杯美式咖啡", "note": "挺不错的咖啡，虽然便宜，但也很好喝"}, "学生-广州-D30": {"id": "学生-广州-D30", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/街饮-13.png", "scene_text": "去南宁旅游，跟表姐买的星巴克", "drink_desc": "好喝的咖啡", "note": "很好喝"}, "学生-广州-D31": {"id": "学生-广州-D31", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/街饮-14.png", "scene_text": "周末休息的时候", "drink_desc": "休息的时候点的泰国奶茶", "note": "外卖点的，很好喝"}, "学生-广州-D32": {"id": "学生-广州-D32", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/街饮-2.png", "scene_text": "跟朋友出去吃的一家烤肉店", "drink_desc": "那时候放纵日，在店附近买的热饮阿萨姆", "note": "阿萨姆奶茶是我国民饮料了，大大小少都会喝过，也是我们这一代得青春回忆之一"}, "学生-广州-D33": {"id": "学生-广州-D33", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/街饮-3.png", "scene_text": "去东北旅行逛东北早市", "drink_desc": "在东北集市上买的玉米汁", "note": "不能放太久，放太久不好喝"}, "学生-广州-D34": {"id": "学生-广州-D34", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/街饮-4.png", "scene_text": "在哈尔滨冰雪大世界游玩", "drink_desc": "喜欢的现打热红酒，那天太冷，在屋子里喝", "note": "无"}, "学生-广州-D35": {"id": "学生-广州-D35", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/街饮-5.png", "scene_text": "自己在家做饭后点了一杯奶茶", "drink_desc": "喜欢茶的柚子普洱，冬天，想喝点暖和的下饭吃", "note": ""}, "学生-广州-D36": {"id": "学生-广州-D36", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/街饮-6.png", "scene_text": "和同学去奶茶店喝东西打游戏", "drink_desc": "热珍珠奶茶，冬天的经典搭配，喝起来心里暖暖的", "note": "奶味很足，用的是大红袍的红茶"}, "学生-广州-D37": {"id": "学生-广州-D37", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/街饮-7.png", "scene_text": "和同学去餐厅喝下午茶", "drink_desc": "热小熊柠檬茶，里面包裹的糖在茶底融化后有一番风味", "note": "茶底的红茶味很足，拉过来的喝起来很丝滑"}, "学生-广州-D38": {"id": "学生-广州-D38", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/街饮-8.png", "scene_text": "去星巴克喝热拿铁", "drink_desc": "经典热拿铁，咖啡的香味和牛奶的醇厚融合在一起，非常好喝", "note": "咖啡味很好，牛奶很丝滑"}, "学生-广州-D39": {"id": "学生-广州-D39", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/街饮-9.png", "scene_text": "冬天晚上逛夜市的时候感觉手很冷在街边喝的热饮", "drink_desc": "螺蛳粉奶茶，因为网上最近特别火这种热饮，刚好路过的时候闻着特别香就想试试", "note": "这个奶茶特别好喝，有一股淡淡的茶香配着浓郁的奶香，还是热的喝下整个身体都暖和了"}, "学生-广州-D40": {"id": "学生-广州-D40", "persona": "学生", "city": "广州", "card_image": "原始数据/饮品卡/学生-广州/街饮.png", "scene_text": "在香格里拉逛的时候进的一家有名的酥油茶店", "drink_desc": "喝的酥油茶", "note": "还可以，当地的特色茶，可以尝尝，个人觉得甜的更好喝"}, "学生-成都-D01": {"id": "学生-成都-D01", "persona": "学生", "city": "成都", "card_image": "原始数据/饮品卡/学生-成都/其他-1.png", "scene_text": "早上天冷的时候再食堂买早餐吃", "drink_desc": "天比较冷，早上想吃点清淡的热食，热粥非常的暖胃", "note": "~"}, "学生-成都-D02": {"id": "学生-成都-D02", "persona": "学生", "city": "成都", "card_image": "原始数据/饮品卡/学生-成都/其他.png", "scene_text": "聚餐吃的有点多", "drink_desc": "控油无负担健康", "note": "减肥党的福音"}, "学生-成都-D03": {"id": "学生-成都-D03", "persona": "学生", "city": "成都", "card_image": "原始数据/饮品卡/学生-成都/瓶装饮品-1.png", "scene_text": "春天和朋友们一起去公园野餐，买了好吃的度过了一个下午", "drink_desc": "营养快线，因为零食比较油腻，喝了这个可以解腻", "note": "小时候就经常喝，每个味道都很惊艳，希望越来越好"}, "学生-成都-D04": {"id": "学生-成都-D04", "persona": "学生", "city": "成都", "card_image": "原始数据/饮品卡/学生-成都/瓶装饮品-10.png", "scene_text": "晚上吃完饭后在公园散步的路上", "drink_desc": "吃完饭觉得嘴巴渴，想喝点饮品来解渴，选择了蜜雪冰城的茉莉奶绿", "note": ""}, "学生-成都-D05": {"id": "学生-成都-D05", "persona": "学生", "city": "成都", "card_image": "原始数据/饮品卡/学生-成都/瓶装饮品-11.png", "scene_text": "在外聚餐的时候，吃火锅我们一般会买唯怡豆奶", "drink_desc": "唯怡豆奶解渴解腻，而且唯怡是我们成都专属饮料，从小喝到大", "note": "唯怡豆奶一般都是吃饭的时候，桌上必备品，味道很好。"}, "学生-成都-D06": {"id": "学生-成都-D06", "persona": "学生", "city": "成都", "card_image": "原始数据/饮品卡/学生-成都/瓶装饮品-12.png", "scene_text": "露营的时候", "drink_desc": "热的阿萨姆奶茶方便购买，方便携带，露营有气氛感", "note": "阿萨姆奶茶冬天的时候有热感的，而且卖的地方还挺多的"}, "学生-成都-D07": {"id": "学生-成都-D07", "persona": "学生", "city": "成都", "card_image": "原始数据/饮品卡/学生-成都/瓶装饮品-13.png", "scene_text": "欢迎晚会表演", "drink_desc": "太冷了，又要穿棉子，然后就买了一瓶来暖暖身体", "note": "那天晚上喝了我没睡着哈哈哈"}, "学生-成都-D08": {"id": "学生-成都-D08", "persona": "学生", "city": "成都", "card_image": "原始数据/饮品卡/学生-成都/瓶装饮品-14.png", "scene_text": "依旧学习，自习室", "drink_desc": "因为自习室不能带现制奶茶，所以就带了经典永不过时的旺仔牛奶，实在美味", "note": "在自习楼下便利店的那种加热程度里买的，在寒冷的冬天来上一口这种热乎乎的小甜水真幸福啊。"}, "学生-成都-D09": {"id": "学生-成都-D09", "persona": "学生", "city": "成都", "card_image": "原始数据/饮品卡/学生-成都/瓶装饮品-15.png", "scene_text": "上课中", "drink_desc": "当时就想喝点热的，然后一大早我还没吃饭，我也不想喝奶，所以买了这个，而且薏米可以排湿", "note": "味道淡淡的，喝着很健康呀哈哈哈"}, "学生-成都-D10": {"id": "学生-成都-D10", "persona": "学生", "city": "成都", "card_image": "原始数据/饮品卡/学生-成都/瓶装饮品-16.png", "scene_text": "在回家路上，想买一杯比较解渴的水", "drink_desc": "在冬天想喝一点解渴和暖胃的，这款看起来刚好可以解决这个问题", "note": "这款味道是酸甜的，比较符合我自己的口味，清爽开胃，体验感较好"}, "学生-成都-D11": {"id": "学生-成都-D11", "persona": "学生", "city": "成都", "card_image": "原始数据/饮品卡/学生-成都/瓶装饮品-17.png", "scene_text": "早上起来去便利店买一杯金银花雪梨水然后去教室", "drink_desc": "这个水刚好可以清热下火，早上喝点比较舒服", "note": "这个饮品我觉得可以少一点甜，甜度降低一点会更清爽，喝起来负担不那么重"}, "学生-成都-D12": {"id": "学生-成都-D12", "persona": "学生", "city": "成都", "card_image": "原始数据/饮品卡/学生-成都/瓶装饮品-18.png", "scene_text": "在家中家人聚餐，易国轻松惬意", "drink_desc": "在冬天聚餐喝唯怡是最佳的选择，味道好又可以搭配食物", "note": "这款饮品喝起来特别美味，价格也合理，坚果和奶香很足"}, "学生-成都-D13": {"id": "学生-成都-D13", "persona": "学生", "city": "成都", "card_image": "原始数据/饮品卡/学生-成都/瓶装饮品-19.png", "scene_text": "吃早餐时来一杯纯牛奶", "drink_desc": "有营养 顶饱又方便带", "note": "这种小包装的携带很方便，上课前拿一盒就能应付早餐，不会撑肚子。"}, "学生-成都-D14": {"id": "学生-成都-D14", "persona": "学生", "city": "成都", "card_image": "原始数据/饮品卡/学生-成都/瓶装饮品-2.png", "scene_text": "周末早上一个人去图书馆学习吃了便利早餐", "drink_desc": "金典纯牛奶，因为有很高的蛋白质，可以助力我长高", "note": "蛋白质特别高，价格也很实惠，希望可以出200毫升的，有时候250毫升喝不完"}, "学生-成都-D15": {"id": "学生-成都-D15", "persona": "学生", "city": "成都", "card_image": "原始数据/饮品卡/学生-成都/瓶装饮品-20.png", "scene_text": "冬天外面寒风刺骨，有点冷，上课之前在便利店拿了一瓶加热的东方树叶，清淡不甜腻，喝着暖胃又…", "drink_desc": "纯茶原味，茶...", "note": "无糖茶喝着没负担，冬天加热之后口感更好，日常解渴特别合适"}, "学生-成都-D16": {"id": "学生-成都-D16", "persona": "学生", "city": "成都", "card_image": "原始数据/饮品卡/学生-成都/瓶装饮品-21.png", "scene_text": "冬天晚上和朋友吃火锅，点瓶热的唯怡豆奶，喝着暖乎乎的，解辣又解腻，比喝水的舒服多了", "drink_desc": "好喝畅销", "note": "唯怡热着喝真的绝了，豆香味更浓，吃火锅喝特别解腻，也不怎么像碳酸饮料那样腻肚子"}, "学生-成都-D17": {"id": "学生-成都-D17", "persona": "学生", "city": "成都", "card_image": "原始数据/饮品卡/学生-成都/瓶装饮品-3.png", "scene_text": "中午吃饭买了米线很好吃有点咸", "drink_desc": "农夫山泉矿泉水，因为它是天然矿泉水喝着让我很放心", "note":  "广州", "card_image": "原始数据/饮品卡/白领-广州/瓶装饮品-2.png", "scene_text": "出门玩要！", "drink_desc": "来一杯阿华田热饮，在户外的冷风中，温暖身体！", "note": "不好找，不是每个便利店都有"}, "白领-广州-D13": {"id": "白领-广州-D13", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/瓶装饮品-3.png", "scene_text": "冬天上课！硬着冷风出门上课", "drink_desc": "星巴克的太妃榛果拿铁！迎着冷冷的风喝下一口暖暖的咖啡，入口是浓郁的榛果香，细腻回甘。", "note": "在我心中作为开冬天的暖饮，地位无异于秋天的第一杯奶茶（虽然我不喝）"}, "白领-广州-D14": {"id": "白领-广州-D14", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/瓶装饮品-4.png", "scene_text": "下午办公间隙，和同事到楼下便利店购买饮品，同事购买其他饮料。", "drink_desc": "瓶装三得利无糖乌龙茶", "note": "便利店保温即拿即喝很方便，解腻清爽，无糖喝着无负担。"}, "白领-广州-D15": {"id": "白领-广州-D15", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/瓶装饮品-5.png", "scene_text": "去上班到一半原因", "drink_desc": "路上买了瓶东方树叶热的", "note": "冬天想喝热饮方便，还能提神"}, "白领-广州-D16": {"id": "白领-广州-D16", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/瓶装饮品-6.png", "scene_text": "每天上班吃早餐", "drink_desc": "喝热的麦香 维他奶", "note": "很适合吃早餐搭配和胃不好的人"}, "白领-广州-D17": {"id": "白领-广州-D17", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/瓶装饮品-7.png", "scene_text": "早上左上班的路上，看到一家面包店还挺人的，买了一个蛋还挺好吃。", "drink_desc": "路上买了瓶雀巢咖啡的，不仅冬天暖胃还能让我吃面包不咽。", "note": "冬天想喝热方便，照顾到了胃不适的人。"}, "白领-广州-D18": {"id": "白领-广州-D18", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/瓶装饮品-8.png", "scene_text": "", "drink_desc": "午后红茶，提神醒脑", "note": "欢迎积极分享"}, "白领-广州-D19": {"id": "白领-广州-D19", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/瓶装饮品-9.png", "scene_text": "重回校园，吃了附近的冬阳锅小火锅，等着回", "drink_desc": "从工位上拿回来的统一奶茶，暖暖的很贴心，适合随餐，还能解辣", "note": "经典品牌，希望不要停产，还有童年的味道"}, "白领-广州-D20": {"id": "白领-广州-D20", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/瓶装饮品.png", "scene_text": "是我作为搭配零食的饮料，统一的果汁饮料，作为下午茶去喝", "drink_desc": "因为喝完感觉身体不会感到疲惫，而且口感有一种清新的感觉。", "note": "口感很清新，很有现代的感觉。"}, "白领-广州-D21": {"id": "白领-广州-D21", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/自制饮品-1.png", "scene_text": "女性经期会经历的痛经", "drink_desc": "红糖姜茶。缓解痛经的传统药疗", "note": "欢迎积极分享"}, "白领-广州-D22": {"id": "白领-广州-D22", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/自制饮品-10.png", "scene_text": "早上在家里制作早餐与制作热饮品", "drink_desc": "自己泡了五黑粉，直接用热水冲泡就行了，保持坚持护发养发。", "note": "这个饮品很浓的芝麻香味可以一试，还有养生意识护发的嘛。"}, "白领-广州-D23": {"id": "白领-广州-D23", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/自制饮品-11.png", "scene_text": "最难受得一刻是工作上出差，恰好是自己生日，只能吃好一点早餐。", "drink_desc": "这是自制豆浆机现磨的，因为早上喝杯豆浆营养又暖心。", "note": "这个现磨豆浆最好是新鲜出炉放一些白糖，微甜本来就很好喝了。"}, "白领-广州-D24": {"id": "白领-广州-D24", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/自制饮品-2.png", "scene_text": "作为一个茶商人，在家一定会喝茶！这个场景就是任意一个茶商人家里。", "drink_desc": "热茶，作为地方习惯，一年四季都会喝热茶。", "note": "欢迎激情分享"}, "白领-广州-D25": {"id": "白领-广州-D25", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/自制饮品-3.png", "scene_text": "工作时，需要一杯暖暖的养生茶", "drink_desc": "菊果黄茉水。有功效的养生水", "note": "欢迎积极分享"}, "白领-广州-D26": {"id": "白领-广州-D26", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/自制饮品-4.png", "scene_text": "一个温暖的早上，一杯暖暖豆奶，一片美味吐司", "drink_desc": "冰泉无糖豆奶。自己冲泡的早餐。省事，并且是无糖的，健康！", "note": "配上鲍师傅海苔小贝，甜度综合得刚刚好！"}, "白领-广州-D27": {"id": "白领-广州-D27", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/自制饮品-5.png", "scene_text": "和家人聚餐后煮饮，用立顿茶包加纯牛奶自制奶茶，暖身又温馨。", "drink_desc": "自制热奶茶", "note": "自制奶茶无添加，成本低且健康，立顿茶包和伊利纯牛奶是常见选择。"}, "白领-广州-D28": {"id": "白领-广州-D28", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/自制饮品-6.png", "scene_text": "好不容易的休息日，在家躺着放松看剧。", "drink_desc": "看剧时自己泡了一杯可可饮，挺甜的还润口。", "note": "好喝在家方便冲饮"}, "白领-广州-D29": {"id": "白领-广州-D29", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/自制饮品-7.png", "scene_text": "", "drink_desc": "DIY 热饮，补血，养生", "note": "欢迎激情分享"}, "白领-广州-D30": {"id": "白领-广州-D30", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/自制饮品-8.png", "scene_text": "冬日常", "drink_desc": "养生茶", "note": "欢迎激情分享"}, "白领-广州-D31": {"id": "白领-广州-D31", "persona": "白领", "city": "广州", "card_image": "原始数据/饮品卡/白领-广州/自制饮品-9.png", "scene_text": "冬天在 function escapeHtml(s){return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function highlight(text, kw){
  if (!text || !kw) return escapeHtml(text||'');
  const safe = escapeHtml(text);
  const re = new RegExp(escapeHtml(kw).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g');
  return safe.replace(re, m => `<mark>${m}</mark>`);
}

const toc = document.getElementById('toc');
DATA.megas.forEach((m, mi) => {
  const isOther = (m.name === '其他' || m.name === '未归大类');
  const lbl = document.createElement('div');
  lbl.className = 'toc-label' + (isOther ? ' other' : '');
  lbl.textContent = m.name;
  toc.appendChild(lbl);
  const row = document.createElement('div');
  row.className = 'toc-row';
  m.subs.forEach((c, ci) => {
    const a = document.createElement('a');
    a.href = `#cat-${mi}-${ci}`;
    a.textContent = `${c.name} (${c.total})`;
    if (c.name === '其他/未分类') a.classList.add('other');
    row.appendChild(a);
  });
  toc.appendChild(row);
});

const main = document.getElementById('main');
DATA.megas.forEach((m, mi) => {
  const isOther = (m.name === '其他' || m.name === '未归大类');
  const mega = document.createElement('section');
  mega.className = 'mega' + (isOther ? ' other' : '');
  mega.id = 'mega-' + mi;
  let mh = `<div class="mega-label">${escapeHtml(m.name)}<span class="mega-total">${m.total} 次</span></div>`;
  mh += '<div class="mega-subs">';
  m.subs.forEach((c, ci) => {
    const subOther = (c.name === '其他/未分类');
    mh += `<div class="cat${subOther ? ' other' : ''}" id="cat-${mi}-${ci}">`;
    mh += `<h3>${escapeHtml(c.name)} <span class="total">${c.total} 次 · ${c.keywords.length} 词</span></h3>`;
    mh += '<div class="chips">';
    c.keywords.forEach(k => {
      const cls = k.count >= 5 ? ' high' : '';
      mh += `<span class="chip${cls}" onclick="showQuotes('${escapeHtml(k.kw).replace(/'/g, "\\'")}')">${escapeHtml(k.kw)}<span class="n">×${k.count}</span></span>`;
    });
    mh += '</div></div>';
  });
  mh += '</div>';
  mega.innerHTML = mh;
  main.appendChild(mega);
});

function showQuotes(kw){
  const cardIds = DATA.kw_to_cards[kw] || [];
  const lb = document.getElementById('lb');
  document.getElementById('lbTitle').textContent = `"${kw}" — ${cardIds.length} 张卡`;
  document.getElementById('lbMeta').textContent = '点击图片可放大查看原卡';
  const body = document.getElementById('lbBody');
  body.innerHTML = '';
  cardIds.forEach(cid => {
    const d = DATA.cards[cid];
    if (!d) return;
    const el = document.createElement('div');
    el.className = 'source-card';
    let html = '';
    if (d.card_image) {
      html += `<img src="${encodeURI(d.card_image)}" loading="lazy" onclick="zoomImage(this.src)" onerror="this.style.background='#fee'">`;
    }
    html += `<div class="body">`;
    html += `<div class="id">${escapeHtml(cid)} · ${escapeHtml(d.persona)} · ${escapeHtml(d.city)}</div>`;
    if (d.scene_text) html += `<div class="desc scene">📍 ${highlight(d.scene_text, kw)}</div>`;
    if (d.drink_desc) html += `<div class="desc drink">🥤 ${highlight(d.drink_desc, kw)}</div>`;
    if (d.note)       html += `<div class="desc note">💬 ${highlight(d.note, kw)}</div>`;
    html += '</div>';
    el.innerHTML = html;
    body.appendChild(el);
  });
  lb.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  document.getElementById('lb').classList.remove('show');
  document.body.style.overflow = '';
}
function zoomImage(src){
  const iz = document.getElementById('iz');
  document.getElementById('izImg').src = src;
  iz.classList.add('show');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('iz').classList.remove('show');
    closeLightbox();
  }
});
</script>
</body>
</html>
