const MACRO_META = {"养": {"emoji": "🌱", "def": "向内补给身体", "color": "#b85c5c"}, "暖": {"emoji": "☀️", "def": "向外驱寒，物理温度", "color": "#d9534f"}, "解": {"emoji": "👅", "def": "口腔感官·解决感", "color": "#4caf50"}, "饮": {"emoji": "💧", "def": "纯生理补给", "color": "#5bc0de"}, "能": {"emoji": "⚡", "def": "能量·营养补给", "color": "#f0ad4e"}, "松": {"emoji": "🛋️", "def": "歇一下·喘口气", "color": "#8d6e63"}, "醒": {"emoji": "🧠", "def": "清醒·提神", "color": "#ffa726"}, "庆": {"emoji": "🎉", "def": "节日氛围·热闹", "color": "#d63384"}, "亲": {"emoji": "💕", "def": "亲密·浪漫·近距离", "color": "#ec407a"}, "安": {"emoji": "🕊️", "def": "安心感 — 不同尺度的‘被安顿’", "color": "#5e8bbe"}, "乐": {"emoji": "😁", "def": "纯快乐·多巴胺", "color": "#ff7043"}};          // {key: {emoji, def, color}}
const SUBTYPE_COLORS = {"牛奶": "#F5EBD5", "咖啡": "#5C3520", "奶茶": "#D4A877", "有糖茶": "#A8C272", "无糖茶": "#C5D3A8", "包装水": "#B8D4DC", "草本养生": "#5C7250", "果汁": "#FF9F66", "植物蛋白": "#F0E8D5", "可可饮": "#7A4A2E", "碳酸饮料": "#9CC9DE", "功能饮料": "#FFD24D", "酒": "#7A1F1F", "玉米汁": "#F4D35E", "粥": "#E8DCC4", "其他": "#CFCFCF", "": "#CFCFCF"};  // {name: hex}
const CAT_COLORS = {"冬日通勤": "#546e7a", "欢庆相聚": "#fb8c00", "自己人时刻": "#f57c00", "日常工作学习": "#1976d2", "凑热闹": "#2e7d32", "窝一窝": "#6d4c41", "日常早餐": "#f4a261", "冬日动趣": "#00897b", "偶尔难上加难": "#f06292", "日常饭点": "#d84315", "其他": "#9e9e9e", "noise": "#9e9e9e"};

const SPECIAL_LABEL = {
  'unclassified': '未捕捉 motivation',
  'no_drink':     '无饮品场景',
};

function macroLabel(key) {
  if (SPECIAL_LABEL[key]) return SPECIAL_LABEL[key];
  const m = MACRO_META[key];
  return m ? (key + (m.emoji || '') + '  ' + (m.def || '')) : key;
}

function macroShort(key) {
  if (SPECIAL_LABEL[key]) return SPECIAL_LABEL[key];
  const m = MACRO_META[key];
  return m ? (key + (m.emoji || '')) : key;
}

function filterCards(cat, macro, subtype) {
  const list = SCENE_DATA[cat] || [];
  return list.filter(c => {
    if (macro === 'no_drink') {
      if (!c.no_drink) return false;
    } else if (macro === 'unclassified') {
      if (c.no_drink || c.macro) return false;
    } else if (macro) {
      if (c.macro !== macro) return false;
    }
    if (subtype) {
      if (c.subtype !== subtype) return false;
    }
    return true;
  });
}

/* ── tooltip ── */
const tip = document.getElementById('ring-tip');
function showTip(e, el) {
  const cat = el.dataset.cat || '';
  const layer = el.dataset.layer;
  const macro = el.dataset.macro || '';
  const subtype = el.dataset.subtype || '';
  const count = el.dataset.count;
  let html = '';
  if (layer === 'cat') {
    html = '<b>主题 · ' + cat + '</b><br>共 ' + count + ' 张卡<div class="tip-hint">点击查看 / 选层级</div>';
  } else if (layer === 'macro') {
    html = '<b>' + cat + '</b> · ' + macroShort(macro) + '<br>' + count + ' 张<div class="tip-hint">点击查看 / 选层级</div>';
  } else if (layer === 'subtype') {
    html = '<b>' + cat + '</b> · ' + macroShort(macro) + ' · 品类「' + subtype + '」<br>' + count + ' 张<div class="tip-hint">点击查看 / 选层级</div>';
  }
  tip.innerHTML = html;
  tip.style.display = 'block';
  moveTip(e);
}
function moveTip(e) {
  if (tip.style.display !== 'block') return;
  const pad = 14;
  let x = e.clientX + pad;
  let y = e.clientY + pad;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  if (x + w > window.innerWidth - 8)  x = e.clientX - w - pad;
  if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
  tip.style.left = x + 'px';
  tip.style.top  = y + 'px';
}
function hideTip() { tip.style.display = 'none'; }

/* ── popover (层级选择) ── */
const pop = document.getElementById('ring-popover');
const backdrop = document.getElementById('ring-backdrop');
function showPopover(e, el) {
  const cat = el.dataset.cat;
  const layer = el.dataset.layer;
  const macro = el.dataset.macro || '';
  const subtype = el.dataset.subtype || '';

  // 收集可选层级
  const opts = [];
  // 第一档：本主题
  const allCat = filterCards(cat, null, null);
  opts.push({
    label: '本主题  <span style="color:#888">' + cat + '</span>',
    count: allCat.length,
    filter: { cat, macro:null, subtype:null },
  });
  if (layer === 'macro' || layer === 'subtype') {
    const macroCards = filterCards(cat, macro, null);
    opts.push({
      label: '本主题 + ' + macroShort(macro),
      count: macroCards.length,
      filter: { cat, macro, subtype:null },
    });
  }
  if (layer === 'subtype') {
    const allThree = filterCards(cat, macro, subtype);
    opts.push({
      label: '本主题 + ' + macroShort(macro) + ' + 品类「' + subtype + '」',
      count: allThree.length,
      filter: { cat, macro, subtype },
    });
  }

  // 单层（内圈）直接打开抽屉
  if (opts.length === 1) {
    hideTip();
    openDrawer(opts[0].filter);
    return;
  }

  // 多层 → 弹 popover
  let html = '<div class="pop-title">以哪一层筛选？</div>';
  opts.forEach((o, i) => {
    html += '<button data-i="' + i + '">' + o.label + ' <span class="pop-count">' + o.count + '</span></button>';
  });
  pop.innerHTML = html;
  pop.style.display = 'block';

  // 定位 popover 在鼠标点击位置附近
  const px = e.clientX;
  const py = e.clientY;
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = px + 10, y = py + 10;
  if (x + pw > window.innerWidth - 8)  x = px - pw - 10;
  if (y + ph > window.innerHeight - 8) y = py - ph - 10;
  pop.style.left = x + 'px';
  pop.style.top  = y + 'px';
  backdrop.classList.add('open');

  pop.querySelectorAll('button').forEach((btn, i) => {
    btn.addEventListener('click', () => {
      hidePopover();
      openDrawer(opts[i].filter);
    });
  });
}
function hidePopover() {
  pop.style.display = 'none';
  backdrop.classList.remove('open');
}
backdrop.addEventListener('click', () => {
  hidePopover();
  closeDrawer();
});

/* ── 抽屉 ── */
const drawer = document.getElementById('ring-drawer');
function openDrawer(filter) {
  const { cat, macro, subtype } = filter;
  const cards = filterCards(cat, macro, subtype);
  document.getElementById('dr-title').textContent = cat;

  // chips 显示当前筛选
  let chipsHtml = '<span class="dr-chip" style="background:' + (CAT_COLORS[cat]||'#888') + ';color:#FFF">主题 · ' + cat + '</span>';
  if (macro) {
    chipsHtml += '<span class="dr-chip">' + macroShort(macro) + '</span>';
  }
  if (subtype) {
    chipsHtml += '<span class="dr-chip">品类 · ' + subtype + '</span>';
  }
  document.getElementById('dr-chips').innerHTML = chipsHtml;
  document.getElementById('dr-sub').textContent = cards.length + ' 张卡（含无饮品场景） · 点击卡片缩略图在主看板查看';

  // actions
  document.getElementById('dr-actions').innerHTML =
    '<a href="dashboard-drinks.html" target="_blank">在主看板查看全部 →</a>';

  // body
  const body = document.getElementById('dr-body');
  if (cards.length === 0) {
    body.innerHTML = '<div style="padding:32px;text-align:center;color:#999;font-size:13px">没有匹配的卡片</div>';
  } else {
    body.innerHTML = cards.map(c => renderCard(c)).join('');
  }

  drawer.classList.add('open');
  backdrop.classList.add('open');
}
function closeDrawer() {
  drawer.classList.remove('open');
  backdrop.classList.remove('open');
}

function renderCard(c) {
  const img = c.card_image
    ? '<img class="dr-thumb" src="' + c.card_image + '" alt="" onerror="this.style.background=\'#EEE\';this.removeAttribute(\'src\')">'
    : '<div class="dr-thumb"></div>';
  const tags = [];
  if (c.no_drink) {
    tags.push('<span class="dr-tag t-no-drink">无饮品场景</span>');
  } else {
    if (c.subtype) tags.push('<span class="dr-tag t-subtype">' + c.subtype + (c.temperature ? '·' + c.temperature : '') + '</span>');
    if (c.motivation_primary) {
      const m = MACRO_META[c.macro];
      const emoji = m ? (m.emoji||'') : '';
      tags.push('<span class="dr-tag t-macro">' + c.macro + emoji + ' ' + c.motivation_primary + '</span>');
    }
    if (c.brand) tags.push('<span class="dr-tag">' + c.brand + '</span>');
  }
  const desc = c.drink_desc || c.scene_text || '';
  const linkAttr = c.card_image ? ('href="' + c.card_image + '" target="_blank"') : 'href="javascript:void(0)"';
  return '<a class="dr-card" style="text-decoration:none;color:inherit" ' + linkAttr + '>'
    + img
    + '<div class="dr-meta">'
    + '<div class="dr-id">' + (c.id || '—') + '</div>'
    + '<div style="color:#888;font-size:10px;margin-bottom:2px">' + (c.persona||'') + ' · ' + (c.city||'') + '</div>'
    + '<div class="dr-tags">' + tags.join('') + '</div>'
    + (desc ? '<div class="dr-desc">' + escapeHTML(desc) + '</div>' : '')
    + '</div></a>';
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"]/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
}

/* ── 绑定事件到所有 .ring-sector ── */
document.querySelectorAll('.ring-sector').forEach(el => {
  el.addEventListener('mouseenter', e => showTip(e, el));
  el.addEventListener('mousemove',  e => moveTip(e));
  el.addEventListener('mouseleave', e => hideTip());
  el.addEventListener('click', e => { e.stopPropagation(); hideTip(); showPopover(e, el); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { hidePopover(); closeDrawer(); }
});
</script>
