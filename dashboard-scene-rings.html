原始数据/冬日ingeneral场景/广州-中产/Group 17202.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "一家人围在热气腾腾的锅边，看着食材在清汤里翻滚，聊着日常的玖事。锅里的暖香裹着烟火气，是…", "temperature": "", "brand": "", "no_drink": true}, {"id": "中产无娃-广州-W25", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/冬日ingeneral场景/广州-中产/Group 17206.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "和家人一起泡在暖乎乎的温泉池里，水汽裹着暖意漫过全身，连紧绡的肩膀都跟着放松下来。池边…", "temperature": "", "brand": "", "no_drink": true}, {"id": "中产无娃-广州-W29", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/冬日ingeneral场景/广州-中产/Group 17210.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "春节到啊，过年啊，冷冷的，和家人在一起，“团团圆圆”抗过万寒。", "temperature": "", "brand": "", "no_drink": true}, {"id": "中产无娃-广州-W32", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/冬日ingeneral场景/广州-中产/Group 17213.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "跟家里人一起在家里吃饭呢，爸爸妈妈做的菜才是天底下最美味的", "temperature": "", "brand": "", "no_drink": true}, {"id": "中产无娃-广州-W38", "persona": "中产无娃", "city": "广州", "card_image": "原始数据/冬日ingeneral场景/广州-中产/Group 17219.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "2月份跟朱友们外出烧烤，一起捡柴火、筑起一个窑，吃上肥美的窑鸡啊！", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-广州-W03", "persona": "学生", "city": "广州", "card_image": "原始数据/冬日ingeneral场景/广州-学生/Group 17022.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "元旦和家人去了澳门，人山人海，左右都是人，满22了所以第一次进赌场看了看什么样", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-广州-W05", "persona": "学生", "city": "广州", "card_image": "原始数据/冬日ingeneral场景/广州-学生/Group 17024.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "陪舍友在海底捞过了生日，也是来新学校第一次聚会，大家都很开心点了超多东西...", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-广州-W06", "persona": "学生", "city": "广州", "card_image": "原始数据/冬日ingeneral场景/广州-学生/Group 17025.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "跨年时和朋友一起在广州倒计时跨年", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-广州-W08", "persona": "学生", "city": "广州", "card_image": "原始数据/冬日ingeneral场景/广州-学生/Group 17027.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "立冬和家人在家一起吃饭", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-广州-W13", "persona": "学生", "city": "广州", "card_image": "原始数据/冬日ingeneral场景/广州-学生/Group 17033.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "全家人一起过年", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-广州-W16", "persona": "学生", "city": "广州", "card_image": "原始数据/冬日ingeneral场景/广州-学生/Group 17037.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "和朋友聚餐，在结束了一学期的学业劳累之后，大家欢聚一堂", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-广州-W24", "persona": "学生", "city": "广州", "card_image": "原始数据/冬日ingeneral场景/广州-学生/Group 17045.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "过年期间，约上小时候的发小一起出来聚会放烟花", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-广州-W31", "persona": "学生", "city": "广州", "card_image": "原始数据/冬日ingeneral场景/广州-学生/Group 17052.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "放假的时候\n在奶茶店\n和朋友们聊天八卦...", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-广州-W32", "persona": "学生", "city": "广州", "card_image": "原始数据/冬日ingeneral场景/广州-学生/Group 17053.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "冬至\n在家和家里人团圆\n吃着热乎乎的汤圆...", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-广州-W33", "persona": "学生", "city": "广州", "card_image": "原始数据/冬日ingeneral场景/广州-学生/Group 17054.png", "subtype": "", "motivation_primary": "", "macro": "city": "上海", "card_image": "原始数据/冬日ingeneral场景/上海-白领/Group 10291.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "和朋友一起筹备并庆祝圣诞节，去吃饭并拍照。", "temperature": "", "brand": "", "no_drink": true}, {"id": "白领-上海-W19", "persona": "白领", "city": "上海", "card_image": "原始数据/冬日ingeneral场景/上海-白领/Group 10294.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "和朋友一起吃热腾腾的各种火锅！", "temperature": "", "brand": "", "no_drink": true}, {"id": "白领-上海-W23", "persona": "白领", "city": "上海", "card_image": "原始数据/冬日ingeneral场景/上海-白领/Group 10298.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "圣诞节，我们会把家里简单布置下，一起和圣诞树拍照，然后吃点披萨", "temperature": "", "brand": "", "no_drink": true}, {"id": "白领-上海-W29", "persona": "白领", "city": "上海", "card_image": "原始数据/冬日ingeneral场景/上海-白领/Group 17255.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "和朋友一起跨年，等待着0点的到来，氛围感拉满。", "temperature": "", "brand": "", "no_drink": true}, {"id": "白领-上海-W35", "persona": "白领", "city": "上海", "card_image": "原始数据/冬日ingeneral场景/上海-白领/Group 17261.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "冬天在旅游的时候和家人一起体验当地的温泉", "temperature": "", "brand": "", "no_drink": true}, {"id": "中产无娃-哈尔滨-W01", "persona": "中产无娃", "city": "哈尔滨", "card_image": "原始数据/冬日ingeneral场景/哈尔滨-中产/Group 7051.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "和闺蜜喝一杯热奶茶/热可可\n街边小店、卧室书桌、便利店\n捧着热乎乎的饮品，暖手又暖心，\n慢慢小口喝，甜滋滋治愈冬日寒冷", "temperature": "", "brand": "", "no_drink": true}, {"id": "中产无娃-哈尔滨-W02", "persona": "中产无娃", "city": "哈尔滨", "card_image": "原始数据/冬日ingeneral场景/哈尔滨-中产/Group 7052.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "1. 围炉煮茶\n小院茶室/古风民宿\n三五好友、知己\n围着火炉烤红薯、煮热茶、嗑瓜子\n聊天，慢下来放空取暖", "temperature": "", "brand": "", "no_drink": true}, {"id": "中产无娃-哈尔滨-W11", "persona": "中产无娃", "city": "哈尔滨", "card_image": "原始数据/冬日ingeneral场景/哈尔滨-中产/Group 17222.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "去年冬天领证，结婚纪念日在冬天。", "temperature": "", "brand": "", "no_drink": true}, {"id": "中产无娃-哈尔滨-W27", "persona": "中产无娃", "city": "哈尔滨", "card_image": "原始数据/冬日ingeneral场景/哈尔滨-中产/Group 17238.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "和朋友一起跨年 许下来年的愿望", "temperature": "", "brand": "", "no_drink": true}, {"id": "中产无娃-哈尔滨-W36", "persona": "中产无娃", "city": "哈尔滨", "card_image": "原始数据/冬日ingeneral场景/哈尔滨-中产/Group 17247.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "陪女朋友看大雪人", "temperature": "", "brand": "", "no_drink": true}, {"id": "中产无娃-哈尔滨-W38", "persona": "中产无娃", "city": "哈尔滨", "card_image": "原始数据/冬日ingeneral场景/哈尔滨-中产/Group 17249.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "陪女朋友在海底捞参与夹金豆活动", "temperature": "", "brand": "", "no_drink": true}, {"id": "中产无娃-哈尔滨-W39", "persona": "中产无娃", "city": "哈尔滨", "card_image": "原始数据/冬日ingeneral场景/哈尔滨-中产/Group 17250.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "和大学同学重回校园图书馆", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-哈尔滨-W01", "persona": "学生", "city": "哈尔滨", "card_image": "原始数据/冬日ingeneral场景/哈尔滨-学生/Group 17064.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "和我的好朋友吃麻辣烫", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-哈尔滨-W10", "persona": "学生", "city": "哈尔滨", "card_image": "原始数据/冬日ingeneral场景/哈尔滨-学生/Group 17074.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "喜欢过情人节跟对象", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-哈尔滨-W14", "persona": "学生", "city": "哈尔滨", "card_image": "原始数据/冬日ingeneral场景/哈尔滨-学生/Group 17078.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "和朋友去吃初中时爱吃的美食", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-哈尔滨-W16", "persona": "学生", "city": "哈尔滨", "card_image": "原始数据/冬日ingeneral场景/哈尔滨-学生/Group 17080.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "苦难是文学的温床，也是艺术的，寒冷的冬日总会有些艺术展直击心灵，我喜欢和朋友一起看艺术展。", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-哈尔滨-W18", "persona": "学生", "city": "哈尔滨", "card_image": "原始数据/冬日ingeneral场景/哈尔滨-学生/Group 17082.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "每年跨年夜我们都会出去小搓一顿，听着零点钟声敲响，新的一年也会越来越好的。", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-哈尔滨-W19", "persona": "学生", "city": "哈尔滨", "card_image": "原始数据/冬日ingeneral场景/哈尔滨-学生/Group 17083.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "国庆假期中有一天也是我与男朋友的恋爱纪念日，每年十月二日我们都会去到当时表白的地方(^∇^)", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-哈尔滨-W23", "persona": "学生", "city": "哈尔滨", "card_image": "原始数据/冬日ingeneral场景/哈尔滨-学生/Group 17087.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "和丑小鸡一起玩耍", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-哈尔滨-W27", "persona": "学生", "city": "哈尔滨", "card_image": "原始数据/冬日ingeneral场景/哈尔滨-学生/Group 17092.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "和朋友吃印度菜，感觉这个世界的食物好奇妙", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-哈尔滨-W28", "persona": "学生", "city": "哈尔滨", "card_image": "原始数据/冬日ingeneral场景/哈尔滨-学生/Group 17093.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "和朋友半夜去吃麦当劳，当时觉得我两好饿", "temperature": "", "brand": "", "no_drink": true}, {"id": "学生-哈尔滨-W35", "persona": "学生", "city": "哈尔滨", "card_image": "原始数据/冬日ingeneral场景/哈尔滨-学生/Group 17101.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "第一重要的事情！！和男朋友 _drink": true}, {"id": "白领-成都-W37", "persona": "白领", "city": "成都", "card_image": "原始数据/冬日ingeneral场景/成都-白领/Group 17268.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "冬天把被子晒的暖烘烘的，晚上钻进被窝，全是阳光的味道，睡起来特别安心舒服", "temperature": "", "brand": "", "no_drink": true}, {"id": "白领-成都-W38", "persona": "白领", "city": "成都", "card_image": "原始数据/冬日ingeneral场景/成都-白领/Group 17269.png", "subtype": "", "motivation_primary": "", "macro": "", "drink_desc": "", "scene_text": "不用出门的周末，裹着晒过太阳的毯子，抱着热奶茶看着喜欢的剧，是冬天最放松的时刻", "temperature": "", "brand": "", "no_drink": true}], "日常早餐": [{"id": "中产无娃-上海-D02", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/其他.png", "subtype": "牛奶", "motivation_primary": "养生", "macro": "养", "drink_desc": "公司有咖啡机可以打热牛奶，所以每天早上上班就习惯喝一杯热牛奶，又方便不会迟到又健康...", "scene_text": "早上来公司吃早餐的时候", "temperature": "热", "brand": "其他", "no_drink": false}, {"id": "中产无娃-上海-D07", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-13.png", "subtype": "植物蛋白", "motivation_primary": "养生", "macro": "养", "drink_desc": "冬天早上比较想喝奶类的产品暖胃又能提神，带点甜味会有点多肚子分泌。", "scene_text": "冬天早晨会比较想喝热的奶类产品", "temperature": "热", "brand": "维维", "no_drink": false}, {"id": "中产无娃-上海-D18", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/瓶装饮品-23.png", "subtype": "牛奶", "motivation_primary": "养生", "macro": "养", "drink_desc": "可可牛奶可以提供热量，玻璃瓶也方便加热，暖身暖心。", "scene_text": "冬季早餐的时候一个人享热饮。", "temperature": "热", "brand": "哇米诺", "no_drink": false}, {"id": "中产无娃-上海-D32", "persona": "中产无娃", "city": "上海", "card_image": "原始数据/饮品卡/中产无娃-上海/自制饮品-1.png", "subtype": "植物蛋白", "motivation_primary": "补充能量·热量·营养", "macro": "能", "drink_desc": "早上喝豆奶可以补充蛋白质的需要，再配合面包或者煎头，一顿早餐轻松解决", "scene_text": "有时候早上起来上班很不知道吃啥的时候，就会冲泡一杯热的维维豆奶", "temperature": "热", "brand": "维维", "no_drink": false}, {"id": "中产无娃-哈尔滨-D10", "persona": "中产无娃", "city": "哈尔滨", "card_image": "原始数据/饮品卡/中产无娃-哈尔滨/瓶装饮品-11.png", "subtype": "植物蛋白", "motivation_primary": "多巴胺·快乐", "macro": "乐", "drink_desc" const SPECIAL_LABEL = {
  'unclassified': '未捕捉 motivation',
  'no_drink':     '无饮品场景',
};

function macroLabel(key) {
  if (SPECIAL_LABEL[key]) return SPECIAL_LABEL[key];
  const m = MACRO_META[key];
  return m ? (key + (m.emoji || '') + '  ' + (m.def || '')) : key;
}

function macroShort(key) {
  if (SPECIAL_LABEL[key]) return SPECIAL_LABEL[key];
  const m = MACRO_META[key];
  return m ? (key + (m.emoji || '')) : key;
}

function filterCards(cat, macro, subtype) {
  const list = SCENE_DATA[cat] || [];
  return list.filter(c => {
    if (macro === 'no_drink') {
      if (!c.no_drink) return false;
    } else if (macro === 'unclassified') {
      if (c.no_drink || c.macro) return false;
    } else if (macro) {
      if (c.macro !== macro) return false;
    }
    if (subtype) {
      if (c.subtype !== subtype) return false;
    }
    return true;
  });
}

/* ── tooltip ── */
const tip = document.getElementById('ring-tip');
function showTip(e, el) {
  const cat = el.dataset.cat || '';
  const layer = el.dataset.layer;
  const macro = el.dataset.macro || '';
  const subtype = el.dataset.subtype || '';
  const count = el.dataset.count;
  let html = '';
  if (layer === 'cat') {
    html = '<b>主题 · ' + cat + '</b><br>共 ' + count + ' 张卡<div class="tip-hint">点击查看 / 选层级</div>';
  } else if (layer === 'macro') {
    html = '<b>' + cat + '</b> · ' + macroShort(macro) + '<br>' + count + ' 张<div class="tip-hint">点击查看 / 选层级</div>';
  } else if (layer === 'subtype') {
    html = '<b>' + cat + '</b> · ' + macroShort(macro) + ' · 品类「' + subtype + '」<br>' + count + ' 张<div class="tip-hint">点击查看 / 选层级</div>';
  }
  tip.innerHTML = html;
  tip.style.display = 'block';
  moveTip(e);
}
function moveTip(e) {
  if (tip.style.display !== 'block') return;
  const pad = 14;
  let x = e.clientX + pad;
  let y = e.clientY + pad;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  if (x + w > window.innerWidth - 8)  x = e.clientX - w - pad;
  if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
  tip.style.left = x + 'px';
  tip.style.top  = y + 'px';
}
function hideTip() { tip.style.display = 'none'; }

/* ── popover (层级选择) ── */
const pop = document.getElementById('ring-popover');
const backdrop = document.getElementById('ring-backdrop');
function showPopover(e, el) {
  const cat = el.dataset.cat;
  const layer = el.dataset.layer;
  const macro = el.dataset.macro || '';
  const subtype = el.dataset.subtype || '';

  // 收集可选层级
  const opts = [];
  // 第一档：本主题
  const allCat = filterCards(cat, null, null);
  opts.push({
    label: '本主题  <span style="color:#888">' + cat + '</span>',
    count: allCat.length,
    filter: { cat, macro:null, subtype:null },
  });
  if (layer === 'macro' || layer === 'subtype') {
    const macroCards = filterCards(cat, macro, null);
    opts.push({
      label: '本主题 + ' + macroShort(macro),
      count: macroCards.length,
      filter: { cat, macro, subtype:null },
    });
  }
  if (layer === 'subtype') {
    const allThree = filterCards(cat, macro, subtype);
    opts.push({
      label: '本主题 + ' + macroShort(macro) + ' + 品类「' + subtype + '」',
      count: allThree.length,
      filter: { cat, macro, subtype },
    });
  }

  // 单层（内圈）直接打开抽屉
  if (opts.length === 1) {
    hideTip();
    openDrawer(opts[0].filter);
    return;
  }

  // 多层 → 弹 popover
  let html = '<div class="pop-title">以哪一层筛选？</div>';
  opts.forEach((o, i) => {
    html += '<button data-i="' + i + '">' + o.label + ' <span class="pop-count">' + o.count + '</span></button>';
  });
  pop.innerHTML = html;
  pop.style.display = 'block';

  // 定位 popover 在鼠标点击位置附近
  const px = e.clientX;
  const py = e.clientY;
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = px + 10, y = py + 10;
  if (x + pw > window.innerWidth - 8)  x = px - pw - 10;
  if (y + ph > window.innerHeight - 8) y = py - ph - 10;
  pop.style.left = x + 'px';
  pop.style.top  = y + 'px';
  backdrop.classList.add('open');

  pop.querySelectorAll('button').forEach((btn, i) => {
    btn.addEventListener('click', () => {
      hidePopover();
      openDrawer(opts[i].filter);
    });
  });
}
function hidePopover() {
  pop.style.display = 'none';
  backdrop.classList.remove('open');
}
backdrop.addEventListener('click', () => {
  hidePopover();
  closeDrawer();
});

/* ── 抽屉 ── */
const drawer = document.getElementById('ring-drawer');
function openDrawer(filter) {
  const { cat, macro, subtype } = filter;
  const cards = filterCards(cat, macro, subtype);
  document.getElementById('dr-title').textContent = cat;

  // chips 显示当前筛选
  let chipsHtml = '<span class="dr-chip" style="background:' + (CAT_COLORS[cat]||'#888') + ';color:#FFF">主题 · ' + cat + '</span>';
  if (macro) {
    chipsHtml += '<span class="dr-chip">' + macroShort(macro) + '</span>';
  }
  if (subtype) {
    chipsHtml += '<span class="dr-chip">品类 · ' + subtype + '</span>';
  }
  document.getElementById('dr-chips').innerHTML = chipsHtml;
  document.getElementById('dr-sub').textContent = cards.length + ' 张卡（含无饮品场景） · 点击卡片缩略图在主看板查看';

  // actions
  document.getElementById('dr-actions').innerHTML =
    '<a href="dashboard-drinks.html" target="_blank">在主看板查看全部 →</a>';

  // body
  const body = document.getElementById('dr-body');
  if (cards.length === 0) {
    body.innerHTML = '<div style="padding:32px;text-align:center;color:#999;font-size:13px">没有匹配的卡片</div>';
  } else {
    body.innerHTML = cards.map(c => renderCard(c)).join('');
  }

  drawer.classList.add('open');
  backdrop.classList.add('open');
}
function closeDrawer() {
  drawer.classList.remove('open');
  backdrop.classList.remove('open');
}

function renderCard(c) {
  const img = c.card_image
    ? '<img class="dr-thumb" src="' + c.card_image + '" alt="" onerror="this.style.background=\'#EEE\';this.removeAttribute(\'src\')">'
    : '<div class="dr-thumb"></div>';
  const tags = [];
  if (c.no_drink) {
    tags.push('<span class="dr-tag t-no-drink">无饮品场景</span>');
  } else {
    if (c.subtype) tags.push('<span class="dr-tag t-subtype">' + c.subtype + (c.temperature ? '·' + c.temperature : '') + '</span>');
    if (c.motivation_primary) {
      const m = MACRO_META[c.macro];
      const emoji = m ? (m.emoji||'') : '';
      tags.push('<span class="dr-tag t-macro">' + c.macro + emoji + ' ' + c.motivation_primary + '</span>');
    }
    if (c.brand) tags.push('<span class="dr-tag">' + c.brand + '</span>');
  }
  const desc = c.drink_desc || c.scene_text || '';
  const linkAttr = c.card_image ? ('href="' + c.card_image + '" target="_blank"') : 'href="javascript:void(0)"';
  return '<a class="dr-card" style="text-decoration:none;color:inherit" ' + linkAttr + '>'
    + img
    + '<div class="dr-meta">'
    + '<div class="dr-id">' + (c.id || '—') + '</div>'
    + '<div style="color:#888;font-size:10px;margin-bottom:2px">' + (c.persona||'') + ' · ' + (c.city||'') + '</div>'
    + '<div class="dr-tags">' + tags.join('') + '</div>'
    + (desc ? '<div class="dr-desc">' + escapeHTML(desc) + '</div>' : '')
    + '</div></a>';
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"]/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
}

/* ── 绑定事件到所有 .ring-sector ── */
document.querySelectorAll('.ring-sector').forEach(el => {
  el.addEventListener('mouseenter', e => showTip(e, el));
  el.addEventListener('mousemove',  e => moveTip(e));
  el.addEventListener('mouseleave', e => hideTip());
  el.addEventListener('click', e => { e.stopPropagation(); hideTip(); showPopover(e, el); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { hidePopover(); closeDrawer(); }
});
</script>
</body>
