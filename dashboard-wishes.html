/* 把一张卡的 sub_tags 拍平成 "base|axis=value" 字符串数组，方便筛选 */
function flatSubtags(w) {
  const out = [];
  if (w.sub_tags) {
    for (const [axis, vals] of Object.entries(w.sub_tags)) {
      if (!vals) continue;
      const arr = Array.isArray(vals) ? vals : [vals];
      for (const v of arr) {
        if (v) out.push(`${w.base}|${axis}=${v}`);
      }
    }
  }
  // 该 base 缺值的"必填"维度也产出 "(未标注)" 虚拟值，使 chip 可点击筛选
  const expected = (typeof BASE_AXES !== 'undefined' && BASE_AXES[w.base]) || [];
  for (const axis of expected) {
    const v = (w.sub_tags || {})[axis];
    const hasVal = Array.isArray(v) ? v.length > 0 : !!v;
    if (!hasVal) out.push(`${w.base}|${axis}=(未标注)`);
  }
  return out;
}

  let n = 0;
  for (const w of INIT_DATA) {
    const v = w[field];
    if (multi) {
      if (Array.isArray(v) && v.includes(value)) n++;
    } else {
      if (v === value) n++;
    }
  }
  return n;
}

  }

    let ok = false;
    for (const e of state.elements) if (w.elements.includes(e)) { ok = true; break; }
    if (!ok) return false;
  }
  if (state.reasons.size && ignoreField !== 'reasons') {
    let ok = false;
    for (const r of state.reasons) if (w.reasons.includes(r)) { ok = true; break; }
    if (!ok) return false;
  }
  if (state.persona.size && ignoreField !== 'persona' && !state.persona.has(w.persona)) return false;
  if (state.category.size && ignoreField !== 'category' && !state.category.has(w.category)) return false;
  if (state.scene.size && ignoreField !== 'scene' && !state.scene.has(w.scene)) return false;
  if (state.time.size && ignoreField !== 'time') {
    let ok = false;
    for (const t of state.time) if (w.time_slots.includes(t)) { ok = true; break; }
    if (!ok) return false;
  }
  if (state.search) {
    const q = state.search.toLowerCase();
    const hay = [
      w.taste, w.reason, w.category, w.scene, w.respondent, w.persona, w.job, w.base,
      ...(w.elements||[]), ...(w.reasons||[]), ...(w.time_slots||[]),
      ...flatSubtags(w),
    ].join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function liveCount(field, value, multi=false) {
  let n = 0;
  for (const w of INIT_DATA) {
    if (!passesFilter(w, field)) continue;
    if (field === 'subtag') {
      if (flatSubtags(w).includes(value)) n++;
    } else if (multi) {
      if ((w[field]||[]).includes(value)) n++;
    } else {
      if (w[field] === value) n++;
    }
  }
  return n;
}

/* ───────── 筛选器渲染 ───────── */
function renderFilters() {
  const wrap = document.getElementById('filter-wrap');

  // 第一层 base —— 按 4 大板块分组
  const renderBaseChip = (b) => {
    const total = countBy('base', b);
    if (!total) return '';
    const live = liveCount('base', b);
    const col = BASE_COLORS[b] || BASE_COLORS['其他'];
    const active = state.base.has(b);
    return `<span class="filter-chip ${active?'active colored':''} ${live===0?'zero':''}"
      style="--chip-color:${col.c}"
      onclick="toggleFilter('base', '${b.replace(/'/g,"\\'")}')">${b}<span class="count">${live}</span></span>`;
  };
  const baseGroupHTML = BASE_GROUPS.map(grp => {
    const chips = grp.bases.map(renderBaseChip).join('');
    return `
      <div class="base-group">
        <div class="base-group-name">${grp.name}</div>
        <div class="filter-chips">${chips}</div>
      </div>`;
  }).join('');
  // 不归任何组的 base，单独在棕框外渲染
  const ungroupedHTML = UNGROUPED_BASES.map(renderBaseChip).filter(Boolean).join('');
  const ungroupedBlock = ungroupedHTML
    ? `<div class="base-ungrouped"><div class="filter-chips">${ungroupedHTML}</div></div>`
    : '';

  // 子分类筛选：只显示当前已选中的 base 的子标签
  let subtagSections = '';
  if (state.base.size) {
    // 收集结构：{ base: { axis: { value: total } } }
    const subtagTree = {};
    for (const w of INIT_DATA) {
      if (!state.base.has(w.base)) continue;
      if (!w.sub_tags) continue;
      for (const [axis, vals] of Object.entries(w.sub_tags)) {
        if (!vals) continue;
        const arr = Array.isArray(vals) ? vals : [vals];
        for (const v of arr) {
          if (!v) continue;
          if (!subtagTree[w.base]) subtagTree[w.base] = {};
          if (!subtagTree[w.base][axis]) subtagTree[w.base][axis] = {};
          subtagTree[w.base][axis][v] = (subtagTree[w.base][axis][v] || 0) + 1;
        }
      }
    }
    // 给每个选中 base 的"必填"维度补上 "未标注" chip（仅展示，不参与筛选）
    for (const b of state.base) {
      const expected = BASE_AXES[b] || [];
      if (!expected.length) continue;
      if (!subtagTree[b]) subtagTree[b] = {};
      for (const axis of expected) {
        let missing = 0;
        for (const w of INIT_DATA) {
          if (w.base !== b) continue;
          const v = (w.sub_tags || {})[axis];
          if (!v || (Array.isArray(v) && v.length === 0)) missing++;
        }
        if (missing > 0) {
          if (!subtagTree[b][axis]) subtagTree[b][axis] = {};
          subtagTree[b][axis]['(未标注)'] = missing;
        }
      }
    }
    subtagSections = BASE_ORDER.filter(b => subtagTree[b]).map(b => {
      const col = BASE_COLORS[b] || BASE_COLORS['其他'];
      const axes = subtagTree[b];
      const axisRows = Object.entries(axes).map(([axis, vals]) => {
        // 父子轴层级：父轴选了非匹配值就隐藏子轴
        const parentRel = (AXIS_PARENT[b] && AXIS_PARENT[b][axis]) || null;
        if (parentRel) {
          const parentValuesSelected = [...state.subtag]
            .filter(t => t.startsWith(`${b}|${parentRel.axis}=`))
            .map(t => t.split('=').slice(1).join('='));
          if (parentValuesSelected.length > 0 && !parentValuesSelected.includes(parentRel.value)) {
            return ''; // 父轴选了别的值 → 隐藏当前子轴
          }
        }
        const allVals = Object.entries(vals);
        const spec = (SUBTAG_DISPLAY_GROUPS[b] && SUBTAG_DISPLAY_GROUPS[b][axis]) || null;
        // spec 形态：① 分组 = [[name,[members]], …]（首元素是数组）  ② 仅排序 = ["v1","v2",…]（首元素是字符串）
        const isGrouped = Array.isArray(spec) && spec.length > 0 && Array.isArray(spec[0]);
        const isOrdered = Array.isArray(spec) && spec.length > 0 && typeof spec[0] === 'string';

        const renderChip = ([v, total]) => {
          const key = `${b}|${axis}=${v}`;
          const live = liveCount('subtag', key);
          const active = state.subtag.has(key);
          if (v === '(未标注)') {
            return `<span class="filter-chip subtag-unmarked ${active?'active':''} ${live===0?'zero':''}"
              style="--chip-color:${col.c}" title="该 base 中缺该维度值的卡"
              onclick="toggleFilter('subtag', '${key.replace(/'/g,"\\'")}')">未标注<span class="count">${live}</span></span>`;
          }
          return `<span class="filter-chip ${active?'active':''} ${live===0?'zero':''}"
            style="--chip-color:${col.c}"
            onclick="toggleFilter('subtag', '${key.replace(/'/g,"\\'")}')">${escapeHtml(v)}<span class="count">${live}</span></span>`;
        };

        // 把 (未标注) 单独抽出来，放到最后
        const unmarkedEntry = allVals.find(([v]) => v === '(未标注)');
        const realVals = allVals.filter(([v]) => v !== '(未标注)');

        let inner;
        if (isGrouped) {
          // 有小标题分组的轴（如 果香 主水果）
          const valMap = Object.fromEntries(realVals);
          const used = new Set();
          const groupBlocks = spec.map(([groupName, members]) => {
            const present = members.filter(m => valMap[m] !== undefined);
            present.forEach(m => used.add(m));
            if (!present.length) return '';
            const chips = present.map(m => renderChip([m, valMap[m]])).join('');
            return `<div class="subtag-group"><div class="subtag-group-head">${escapeHtml(groupName)}</div><div class="filter-chips">${chips}</div></div>`;
          }).join('');
          // 兜底：没出现在分组定义里的值
          const leftovers = realVals.filter(([v]) => !used.has(v));
          const leftoverChips = leftovers.length
            ? `<div class="subtag-group"><div class="subtag-group-head">其他</div><div class="filter-chips">${leftovers.map(renderChip).join('')}</div></div>`
            : '';
          // 未标注：单独一行，放最后
          const unmarkedChip = unmarkedEntry
            ? `<div class="subtag-group"><div class="filter-chips">${renderChip(unmarkedEntry)}</div></div>`
            : '';
          inner = groupBlocks + leftoverChips + unmarkedChip;
        } else if (isOrdered) {
          // 仅排序（无小标题）
          const valMap = Object.fromEntries(realVals);
          const ordered = spec
            .filter(v => valMap[v] !== undefined)
            .map(v => [v, valMap[v]]);
          const leftovers = realVals.filter(([v]) => !spec.includes(v));
          const final = [...ordered, ...leftovers];
          if (unmarkedEntry) final.push(unmarkedEntry);
          inner = `<div class="filter-chips">${final.map(renderChip).join('')}</div>`;
        } else {
          // 默认：按数量降序
          const sorted = realVals.sort((a,b)=>b[1]-a[1]);
          if (unmarkedEntry) sorted.push(unmarkedEntry);
          inner = `<div class="filter-chips">${sorted.map(renderChip).join('')}</div>`;
        }
        return `<div class="filter-row"><div class="filter-label" style="color:${col.c}">${escapeHtml(axis)}</div><div class="subtag-axis-body">${inner}</div></div>`;
      }).join('');
      return `<div class="subtag-base-block"><div class="subtag-base-name" style="color:${col.c}">${b}</div>${axisRows}</div>`;
    }).join('');
  }

  // 人群
  const personas = uniqSorted(INIT_DATA.map(w=>w.persona));
  const personaChips = personas.map(p => {
    const live = liveCount('persona', p);
    const active = state.persona.has(p);
    return `<span class="filter-chip ${active?'active':''} ${live===0?'zero':''}"
      onclick="toggleFilter('persona', '${p.replace(/'/g,"\\'")}')">${p}<span class="count">${live}</span></span>`;
  }).join('');

  // 品类
  const cats = uniqSorted(INIT_DATA.map(w=>w.category).filter(Boolean));
  const catChips = cats.map(c => {
    const live = liveCount('category', c);
    const active = state.category.has(c);
    return `<span class="filter-chip ${active?'active':''} ${live===0?'zero':''}"
      onclick="toggleFilter('category', '${c.replace(/'/g,"\\'")}')">${c}<span class="count">${live}</span></span>`;
  }).join('');

  // 场景
  const scenes = uniqSorted(INIT_DATA.map(w=>w.scene).filter(Boolean));
  const sceneChips = scenes.map(s => {
    const live = liveCount('scene', s);
    const active = state.scene.has(s);
    return `<span class="filter-chip ${active?'active':''} ${live===0?'zero':''}"
      onclick="toggleFilter('scene', '${s.replace(/'/g,"\\'")}')">${s}<span class="count">${live}</span></span>`;
  }).join('');

  // 时段
  const timeChips = TIME_ORDER.map(t => {
    const total = countBy('time_slots', t, true);
    if (!total) return '';
    const live = liveCount('time', t, true);
    const active = state.time.has(t);
    return `<span class="filter-chip ${active?'active':''} ${live===0?'zero':''}"
      onclick="toggleFilter('time', '${t}')">${t}<span class="count">${live}</span></span>`;
  }).join('');

  const subtagBlock = state.base.size
    ? `<div class="filter-group">
         <div class="filter-group-head"><span class="icon">🏷️</span> 子分类（仅显示已选 base） <span class="sub">点击筛选 · 多选</span></div>
         <div class="subtag-wrap">${subtagSections || '<div class="empty-hint">该 base 暂无子分类</div>'}</div>
       </div>`
    : `<div class="filter-group" style="opacity:0.55">
         <div class="filter-group-head"><span class="icon">🏷️</span> 子分类 <span class="sub">先选一个 base 才会展开</span></div>
       </div>`;

  wrap.innerHTML = `
    <div class="filter-group">
      <div class="filter-group-head"><span class="icon">🥛</span> 口味大类（base） <span class="sub">按口感分 4 板块 · 点击筛选 · 多选</span></div>
      <div class="base-groups">${baseGroupHTML}${ungroupedBlock}</div>
    </div>
    ${subtagBlock}
    <details>
      <summary>👥 更多筛选：人群 / 品类 / 场景 / 时段 / 喝的原因</summary>
      <div class="filter-group" style="margin-top:6px">
        <div class="filter-rows">
          <div class="filter-row"><div class="filter-label">人群</div><div class="filter-chips">${personaChips}</div></div>
          <div class="filter-row"><div class="filter-label">品类</div><div class="filter-chips">${catChips}</div></div>
          <div class="filter-row"><div class="filter-label">场景</div><div class="filter-chips">${sceneChips}</div></div>
          <div class="filter-row"><div class="filter-label">时段</div><div class="filter-chips">${timeChips}</div></div>
          <div class="filter-row"><div class="filter-label">喝的原因</div><div class="filter-chips">${REASON_ORDER.map(r => {
            const total = countBy('reasons', r, true);
            if (!total) return '';
            const live = liveCount('reasons', r, true);
            const active = state.reasons.has(r);
            return `<span class="filter-chip ${active?'active':''} ${live===0?'zero':''}"
              onclick="toggleFilter('reasons', '${r.replace(/'/g,"\\'")}')">${r}<span class="count">${live}</span></span>`;
          }).join('')}</div></div>
        </div>
      </div>
    </details>
  `;
}

/* ───────── 卡片渲染 ───────── */
function highlight(text, q) {
  if (!q || !text) return escapeHtml(text || '');
  const safe = escapeHtml(text);
  const safeQ = escapeHtml(q);
  return safe.replace(new RegExp(safeQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),
    m => `<mark class="search-hit">${m}</mark>`);
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]); }

function cardHTML(w, q) {
  const col = BASE_COLORS[w.base] || BASE_COLORS['其他'];
  const elems = (w.elements||[]).map(e => `<span class="badge elem">${escapeHtml(e)}</span>`).join('');
  const reasons = (w.reasons||[]).map(r => `<span class="badge reason">${escapeHtml(r)}</span>`).join('');
  // 子标签（按轴展示）
  const subBits = [];
  if (w.sub_tags) {
    for (const [axis, vals] of Object.entries(w.sub_tags)) {
      if (!vals) continue;
      const arr = Array.isArray(vals) ? vals : [vals];
      const nonEmpty = arr.filter(Boolean);
      if (!nonEmpty.length) continue;
      const valHtml = nonEmpty.map(v => `<span class="badge subtag" style="background:${col.bg};color:${col.c};border:1px solid ${col.c}33">${escapeHtml(v)}</span>`).join('');
      subBits.push(`<span class="subtag-axis"><span class="subtag-axis-name">${escapeHtml(axis)}</span>${valHtml}</span>`);
    }
  }
  const subRow = subBits.length ? `<div class="subtag-row">${subBits.join('')}</div>` : '';
  const meta = [];
  if (w.category) meta.push(`<span class="badge subtype">${escapeHtml(w.category)}</span>`);
  if (w.scene) meta.push(`<span class="badge meta-chip">📍 ${escapeHtml(w.scene)}</span>`);
  if (w.time_slots && w.time_slots.length) meta.push(`<span class="badge meta-chip">🕐 ${w.time_slots.map(escapeHtml).join('·')}</span>`);
  return `
    <div class="card" style="--card-color:${col.c}">
      <div class="card-head">
        <span class="badge base">${escapeHtml(w.base)}</span>
        <span class="badge persona">${escapeHtml(w.persona)}</span>
      </div>
      <div class="taste">${highlight(w.taste || '(未填)', q)}</div>
      <div class="reason-txt">${highlight(w.reason || '(未填理由)', q)}</div>
      ${subRow}
      <div class="meta-row">${meta.join('')}</div>
      ${elems ? `<div><div class="label">口味元素</div><div class="badges-row" style="margin-top:3px">${elems}</div></div>` : ''}
      ${reasons ? `<div><div class="label">喝的原因</div><div class="badges-row" style="margin-top:3px">${reasons}</div></div>` : ''}
      <div class="respondent">— ${escapeHtml(w.respondent)}（${escapeHtml(w.job||'')}）· #${w.id}</div>
    </div>
  `;
}

function renderCards() {
  const q = state.search.trim();
  const filtered = INIT_DATA.filter(passesFilter);
  const stats = document.getElementById('stats-line');
  stats.innerHTML = `当前显示 <b>${filtered.length}</b> / ${INIT_DATA.length} 条许愿`;

  // 按第一层 base 分组
  const groups = {};
  for (const b of BASE_ORDER) groups[b] = [];
  for (const w of filtered) (groups[w.base] || groups['其他']).push(w);

  const area = document.getElementById('cards-area');
  if (!filtered.length) {
    area.innerHTML = `<div class="empty-state">没有匹配的许愿。试试调整筛选。</div>`;
    return;
  }
  area.innerHTML = BASE_ORDER.map(b => {
    const list = groups[b];
    if (!list.length) return '';
    const col = BASE_COLORS[b];
    return `
      <div class="group-section">
        <div class="group-head" style="--group-color:${col.c};--group-bg:${col.bg}">
          <span class="group-title">${b}</span>
          <span class="group-count">${list.length} 条</span>
        </div>
        <div class="cards-grid">${list.map(w => cardHTML(w, q)).join('')}</div>
      </div>
    `;
  }).join('');
}

function render() {
  state.search = document.getElementById('search-input').value || '';
  renderFilters();
  renderCards();
}

function toggleFilter(field, value) {
  const set = state[field];
  if (!set) return;
  if (set.has(value)) set.delete(value); else set.add(value);
  render();
}
function clearAllFilters() {
  for (const k of ['base','subtag','elements','reasons','persona','category','scene','time']) state[k].clear();
  document.getElementById('search-input').value = '';
  state.search = '';
  render();
}

/* ───────── 入口 ───────── */
document.getElementById('total-count').textContent = INIT_DATA.length;
render();
</script>
