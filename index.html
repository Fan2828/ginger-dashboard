<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ginger 暖饮研究 · 看板导航</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fdf6ec;
    color: #222;
    min-height: 100vh;
    padding: 48px 24px;
  }
  .container { max-width: 960px; margin: 0 auto; }
  h1 {
    font-size: 28px;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 36px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  a.card {
    display: block;
    background: #fff;
    border-radius: 14px;
    padding: 22px 20px;
    text-decoration: none;
    color: inherit;
    border-left: 6px solid;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
  }
  .card .label {
    font-size: 12px;
    color: #999;
    margin-bottom: 6px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .card h2 {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .card p {
    font-size: 13px;
    color: #666;
    line-height: 1.5;
  }
  .c1 { border-left-color: #e07a5f; }
  .c2 { border-left-color: #f2cc8f; }
  .c3 { border-left-color: #81b29a; }
  .c4 { border-left-color: #3d5a80; }
  .c5 { border-left-color: #b56576; }
  footer {
    margin-top: 48px;
    color: #aaa;
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Ginger 暖饮研究 · 看板导航</h1>
    <p class="subtitle">点击下方任一卡片进入对应看板</p>

    <div class="grid">
      <a class="card c1" href="dashboard-scenes.html">
        <div class="label">01 · 场景</div>
        <h2>用户场景卡看板</h2>
        <p>消费者在何时、何地、为何选择暖饮的真实场景。</p>
      </a>
      <a class="card c2" href="dashboard-v2.html">
        <div class="label">02 · 期望</div>
        <h2>希望瓶装热饮出现的场景</h2>
        <p>用户期待在哪些场景能买到瓶装热饮。</p>
      </a>
      <a class="card c3" href="dashboard-complaints.html">
        <div class="label">03 · 痛点</div>
        <h2>不好的体验 · 评价看板</h2>
        <p>用户反馈的负面体验，按主题与子类聚合。</p>
      </a>
      <a class="card c4" href="dashboard-devices.html">
        <div class="label">04 · 设备</div>
        <h2>暖饮加热设备看板</h2>
        <p>用户实拍的家用与外出加热设备图鉴。</p>
      </a>
      <a class="card c5" href="dashboard-heating.html">
        <div class="label">05 · 选型</div>
        <h2>加热设备选型看板</h2>
        <p>不同人群对加热设备的偏好与选择。</p>
      </a>
    </div>

    <footer>Ginger Research · 暖饮分类研究项目</footer>
  </div>
</body>
</html>
